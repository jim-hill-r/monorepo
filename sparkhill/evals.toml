[[eval]]
id = "practice-query-drops-unknowns"
requirement = "SPRK-008"
stages = ["ci"]
kind = "cargo"
filter = "a_practice_query_drops_unknown_and_repeated_expressions"

[[eval]]
id = "practice-ends-when-stable"
requirement = "SPRK-008"
stages = ["ci"]
kind = "cargo"
filter = "practising_only_some_letters_ends_once_they_are_stable"

# SPRK-009: A learner can practise with less help

[[eval]]
id = "technique-query-and-default"
requirement = "SPRK-009"
stages = ["ci"]
kind = "cargo"
filter = "the_query_wins_over_the_saved_technique_and_tracing_is_the_default"

[[eval]]
id = "techniques-in-the-browser"
requirement = "SPRK-009"
stages = ["ci", "cd"]
kind = "playwright"
description = "Pattern keeps the start dots while drawing; Freeform shows nothing; both pass a letter written right; the choice is remembered."
