# sparkhill/website: perseus-web project. Standard tasks: ci, fix, build, test, dev, release, deploy.
# Run with: mise run <task>

[tools]
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
cargo-binstall = "latest"
"cargo:perseus-cli" = "0.4.2"
# perseus-cli's own downloader for these timed out on a GitHub runner, so
# mise installs them and release passes their paths. wasm-bindgen must match
# the wasm-bindgen in Cargo.lock exactly (tests/tools.rs checks it).
"github:wasm-bindgen/wasm-bindgen" = "0.2.106"
"github:WebAssembly/binaryen" = "version_123"
# For the Playwright smoke tests of the export (e2e/, `mise run e2e`).
node = "24"

[task_config]
includes = ["../../standards/tasks/perseus-web.toml"]

# Export only (docs/decisions/0001-static-site-on-cloudflare-pages.md): there
# is no server to `perseus serve`, so dev serves the static export, as
# Cloudflare Pages does, and rebuilds it on changes.
[tasks.dev]
description = "Export the site and serve the static files, rebuilding on changes"
run = "perseus export -s -w --wasm-bindgen-path \"$(command -v wasm-bindgen)\" --wasm-opt-path \"$(command -v wasm-opt)\""

# Use the wasm-bindgen and wasm-opt that mise installed (see [tools]), so
# perseus-cli downloads nothing. Cargo.lock stays in lockfile format 3, the
# only one perseus-cli 0.4.2 can read.
[tasks.release]
description = "Static export (output in dist/exported), which ../cloudflare deploys"
run = "perseus export --release --wasm-bindgen-path \"$(command -v wasm-bindgen)\" --wasm-opt-path \"$(command -v wasm-opt)\""

# Playwright smoke tests of the release export: e2e/serve.mjs serves
# dist/exported as Cloudflare Pages does, and the tests load it at desktop
# and phone widths. As in the dioxus-web e2e task, a tool a cloud sandbox
# can't install skips them outside CI (CI unset) and fails them in CI.
[tasks.e2e]
description = "Export the site, then run the Playwright smoke tests on it"
run = """
skip() {
  echo "e2e: $1" >&2
  if [ -n "${CI:-}" ]; then exit 1; fi
  echo "e2e: Playwright tests not checked here; PR CI runs them" >&2
  exit 0
}
npm ci || skip "couldn't install the npm packages"
mise run release || skip "couldn't export the site"
npx playwright install --with-deps chromium || skip "couldn't install Playwright's browsers"
mkdir -p target/evals-reports
rm -f target/evals-reports/playwright.json
PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/target/evals-reports/playwright.json" npm test -- --reporter=list,json
"""

[tasks.test]
description = "Rust tests, then the Playwright smoke tests (e2e)"
run = ["cargo test", "mise run e2e"]

[tasks.ci]
description = "Everything CI checks; makes no artifacts (test reports go in target/evals-reports)"
depends = ["ci:deps"]
run = [
  "cargo fmt --all --check",
  "cargo clippy -- -D warnings",
  "cargo build",
  "bash \"$(git rev-parse --show-toplevel)/standards/scripts/evals.sh\" report cargo-test cargo test",
  "mise run e2e",
]
