# sparkhill/website: perseus-web project. Standard tasks: ci, fix, build, test, dev, release, deploy.
# Run with: mise run <task>

[tools]
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
cargo-binstall = "latest"
"cargo:perseus-cli" = "0.4.2"
# perseus-cli's own downloader for these timed out on a GitHub runner, so
# mise installs them and release passes their paths. wasm-bindgen must match
# the wasm-bindgen in Cargo.lock exactly (tests/tools.rs checks it).
"github:wasm-bindgen/wasm-bindgen" = "0.2.106"
"github:WebAssembly/binaryen" = "version_123"

[task_config]
includes = ["../../standards/tasks/perseus-web.toml"]

# Export only (docs/decisions/0001-static-site-on-cloudflare-pages.md): there
# is no server to `perseus serve`, so dev serves the static export, as
# Cloudflare Pages does, and rebuilds it on changes.
[tasks.dev]
description = "Export the site and serve the static files, rebuilding on changes"
run = "perseus export -s -w --wasm-bindgen-path \"$(command -v wasm-bindgen)\" --wasm-opt-path \"$(command -v wasm-opt)\""

# Use the wasm-bindgen and wasm-opt that mise installed (see [tools]), so
# perseus-cli downloads nothing. Cargo.lock stays in lockfile format 3, the
# only one perseus-cli 0.4.2 can read.
[tasks.release]
description = "Static export (output in dist/exported), which ../cloudflare deploys"
run = "perseus export --release --wasm-bindgen-path \"$(command -v wasm-bindgen)\" --wasm-opt-path \"$(command -v wasm-opt)\""
