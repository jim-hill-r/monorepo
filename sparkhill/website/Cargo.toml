[package]
name = "sparkhill_website"
version = "0.1.0"
# 2021, not 2024: perseus-cli 0.4.2 (pinned with perseus) fails to parse a
# Cargo.toml with edition 2024, so `perseus export` would not run.
edition = "2021"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_code = "forbid"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Dependencies for the engine and the browser go here
[dependencies]
perseus = { version = "=0.4.2", features = ["hydrate", "translator-lightweight"] }
sycamore = "=0.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Engine-only dependencies go here. The engine only runs at build time
# (`perseus export`): the site is static files on Cloudflare Pages, so there
# is no server integration (no axum server).
[target.'cfg(engine)'.dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

# Browser-only dependencies go here
[target.'cfg(client)'.dependencies]
