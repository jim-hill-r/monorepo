[package]
name = "sparkhill_webapp"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
dioxus = { version = "0.6", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["web"]
web = []
