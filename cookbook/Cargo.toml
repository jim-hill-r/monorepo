[workspace]
resolver = "2"
members = ["cloudflare", "core", "data_md", "web", "recipe_gen"]
default-members = ["web", "core", "data_md", "recipe_gen"]

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
dioxus = { version = "0.7.2" }
auth_sdk = { path = "../auth_sdk" }
chrono = { version = "0.4.41", features = ["wasmbind"] }

[profile]

# Small wasm for `dx bundle --release` (the deployed site); see README.md
# "Release size". Not `strip = true`: it removes the wasm's `target_features`
# section and wasm-bindgen then fails, so the bundle (and deploy) breaks.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"
