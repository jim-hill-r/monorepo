[package]
name = "cookbook_recipe_gen"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "recipe-gen"
path = "src/main.rs"

[[bin]]
name = "uuid-migration"
path = "src/uuid_migration.rs"

[[bin]]
name = "filename-migration"
path = "src/filename_migration.rs"

[[bin]]
name = "plan-uuid-migration"
path = "src/plan_uuid_migration.rs"

[[bin]]
name = "migration-validator"
path = "src/migration_validator.rs"

[dependencies]
cookbook_core = { path = "../core" }
cookbook_data_md = { path = "../data_md" }
rand = "0.8"
uuid = "1.0"

[dev-dependencies]
tempfile = "3.0"
