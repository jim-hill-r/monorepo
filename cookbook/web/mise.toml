# cookbook/web: dioxus-web project. Standard tasks: ci, fix, build, test, dev, release, deploy.
# Run with: mise run <task>

[tools]
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
cargo-binstall = "latest"
"cargo:dioxus-cli" = "0.7"  # no Cargo.lock: latest 0.7.x, like cargo resolves dioxus
node = "24"

[task_config]
includes = ["../../standards/tasks/dioxus-web.toml"]
