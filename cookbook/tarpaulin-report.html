templates.to_vec();\n\n    let categories = Category::all();\n    let cuisines = Cuisine::all();\n\n    // Common ingredients for generating variations\n    let proteins = [\"chicken\", \"beef\", \"pork\", \"fish\", \"tofu\", \"shrimp\", \"lamb\"];\n    let vegetables = [\n        \"broccoli\",\n        \"carrots\",\n        \"bell peppers\",\n        \"zucchini\",\n        \"spinach\",\n        \"mushrooms\",\n    ];\n    let grains = [\"rice\", \"pasta\", \"quinoa\", \"couscous\", \"noodles\"];\n\n    while recipes.len() \u003c target_count {\n        // These are safe because the slices are non-empty\n        let Some(\u0026category) = categories.choose(\u0026mut rng) else {\n            continue;\n        };\n        let Some(\u0026cuisine) = cuisines.choose(\u0026mut rng) else {\n            continue;\n        };\n\n        // Generate a unique recipe based on random combination\n        let Some(\u0026protein) = proteins.choose(\u0026mut rng) else {\n            continue;\n        };\n        let Some(\u0026vegetable) = vegetables.choose(\u0026mut rng) else {\n            continue;\n        };\n        let Some(\u0026grain) = grains.choose(\u0026mut rng) else {\n            continue;\n        };\n\n        let title = match category {\n            Category::Breakfast =\u003e format!(\n                \"{} {} Breakfast Bowl\",\n                cuisine.as_str().replace('-', \" \"),\n                protein\n            ),\n            Category::Lunch =\u003e format!(\n                \"{} {} Wrap with {}\",\n                cuisine.as_str().replace('-', \" \"),\n                protein,\n                vegetable\n            ),\n            Category::Dinner =\u003e format!(\n                \"{} {} with {} and {}\",\n                cuisine.as_str().replace('-', \" \"),\n                protein,\n                vegetable,\n                grain\n            ),\n            Category::Dessert =\u003e format!(\n                \"{} Style Cake with {} Filling\",\n                cuisine.as_str().replace('-', \" \"),\n                vegetable\n            ),\n            Category::Snack =\u003e format!(\"Crispy {} Bites\", vegetable),\n            Category::Appetizer =\u003e {\n                format!(\"{} {} Skewers\", cuisine.as_str().replace('-', \" \"), protein)\n            }\n            Category::Soup =\u003e format!(\n                \"{} {} Soup with {}\",\n                cuisine.as_str().replace('-', \" \"),\n                protein,\n                vegetable\n            ),\n            Category::Salad =\u003e format!(\"Fresh {} Salad with {}\", vegetable, protein),\n            Category::Beverage =\u003e format!(\n                \"{} Style {} Smoothie\",\n                cuisine.as_str().replace('-', \" \"),\n                vegetable\n            ),\n        };\n\n        let description = format!(\n            \"A delicious {} dish combining {} with fresh {} served with {}\",\n            cuisine.as_str(),\n            protein,\n            vegetable,\n            grain\n        );\n\n        let prep_time = rng.gen_range(5..=30);\n        let cook_time = rng.gen_range(10..=60);\n        let servings = rng.gen_range(2..=8);\n\n        let ingredients = vec![\n            format!(\"1 lb {}\", protein),\n            format!(\"2 cups {}\", vegetable),\n            format!(\"1 cup {}\", grain),\n            \"2 tablespoons olive oil\".to_string(),\n            \"Salt and pepper to taste\".to_string(),\n            \"2 cloves garlic, minced\".to_string(),\n        ];\n\n        let instructions = vec![\n            format!(\"Prepare {} by cutting into bite-sized pieces\", protein),\n            format!(\"Heat olive oil in a large pan\"),\n            format!(\"Cook {} until golden\", protein),\n            format!(\"Add {} and garlic, sauté until tender\", vegetable),\n            format!(\"Meanwhile, cook {} according to package directions\", grain),\n            format!(\"Combine everything and season with salt and pepper\"),\n            \"Serve hot and enjoy\".to_string(),\n        ];\n\n        recipes.push(RecipeTemplate {\n            title,\n            description,\n            category,\n            cuisine,\n            prep_time,\n            cook_time,\n            servings,\n            ingredients,\n            instructions,\n        });\n    }\n\n    recipes\n}\n\nfn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    println!(\"Recipe Generation Tool\");\n    println!(\"======================\\n\");\n\n    let content_dir = \"../content\";\n\n    // Check if content directory exists\n    if !std::path::Path::new(content_dir).exists() {\n        eprintln!(\"Error: Content directory '{}' does not exist\", content_dir);\n        eprintln!(\"Please run this tool from the cookbook/recipe_gen directory\");\n        std::process::exit(1);\n    }\n\n    println!(\"Generating recipe templates...\");\n    let base_templates = generate_recipe_templates();\n    println!(\"Generated {} base recipe templates\", base_templates.len());\n\n    println!(\"Generating additional recipe variations...\");\n    let all_templates = generate_additional_recipes(\u0026base_templates, 365);\n    println!(\"Generated {} total recipes\", all_templates.len());\n\n    // Shuffle recipes for variety across days\n    let mut rng = rand::thread_rng();\n    let mut shuffled_templates = all_templates;\n    shuffled_templates.shuffle(\u0026mut rng);\n\n    println!(\"\\nWriting recipes to markdown files...\");\n    let mut store = MarkdownRecipeStore::new(content_dir)?;\n\n    let mut created_count = 0;\n    let mut skipped_count = 0;\n    let mut failed_count = 0;\n\n    for (index, template) in shuffled_templates.iter().enumerate().take(365) {\n        let day = (index + 1) as u32;\n        let recipe = template.to_recipe(day);\n\n        // Check if recipe already exists\n        if store.exists(\u0026recipe.id) {\n            println!(\"  Skipping day-{} (already exists)\", day);\n            skipped_count += 1;\n            continue;\n        }\n\n        match store.create(recipe) {\n            Ok(()) =\u003e {\n                created_count += 1;\n                if created_count % 50 == 0 {\n                    println!(\"  Created {} recipes...\", created_count);\n                }\n            }\n            Err(e) =\u003e {\n                eprintln!(\"  Error creating recipe for day-{}: {}\", day, e);\n                failed_count += 1;\n            }\n        }\n    }\n\n    println!(\"\\nRecipe Generation Complete!\");\n    println!(\"  Created: {} recipes\", created_count);\n    println!(\"  Skipped: {} recipes (already existed)\", skipped_count);\n    println!(\"  Failed: {} recipes\", failed_count);\n    println!(\n        \"  Total: {} recipe files should exist\",\n        created_count + skipped_count\n    );\n\n    // Verify all day files exist\n    println!(\"\\nVerifying all day files...\");\n    let mut missing_days = Vec::new();\n    for day in 1..=365 {\n        let id = format!(\"day-{}\", day);\n        if !store.exists(\u0026id) {\n            missing_days.push(day);\n        }\n    }\n\n    if missing_days.is_empty() {\n        println!(\"✓ All 365 day files exist!\");\n    } else {\n        println!(\n            \"⚠ Missing {} day files: {:?}\",\n            missing_days.len(),\n            missing_days\n        );\n    }\n\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_category_as_str() {\n        assert_eq!(Category::Breakfast.as_str(), \"breakfast\");\n        assert_eq!(Category::Dessert.as_str(), \"dessert\");\n    }\n\n    #[test]\n    fn test_cuisine_as_str() {\n        assert_eq!(Cuisine::Italian.as_str(), \"italian\");\n        assert_eq!(Cuisine::Chinese.as_str(), \"chinese\");\n    }\n\n    #[test]\n    fn test_recipe_template_to_recipe() {\n        let template = RecipeTemplate {\n            title: \"Test Recipe\".to_string(),\n            description: \"A test recipe\".to_string(),\n            category: Category::Breakfast,\n            cuisine: Cuisine::American,\n            prep_time: 10,\n            cook_time: 15,\n            servings: 4,\n            ingredients: vec![\"ingredient 1\".to_string()],\n            instructions: vec![\"instruction 1\".to_string()],\n        };\n\n        let recipe = template.to_recipe(1);\n        assert_eq!(recipe.id, \"day-1\");\n        assert_eq!(recipe.title, \"Test Recipe\");\n        assert_eq!(recipe.prep_time_minutes, Some(10));\n        assert_eq!(recipe.cook_time_minutes, Some(15));\n        assert!(recipe.tags.contains(\u0026\"breakfast\".to_string()));\n        assert!(recipe.tags.contains(\u0026\"american\".to_string()));\n    }\n\n    #[test]\n    fn test_generate_recipe_templates() {\n        let templates = generate_recipe_templates();\n        assert!(!templates.is_empty());\n\n        // Verify templates have required fields\n        for template in \u0026templates {\n            assert!(!template.title.is_empty());\n            assert!(!template.description.is_empty());\n            assert!(!template.ingredients.is_empty());\n            assert!(!template.instructions.is_empty());\n            assert!(template.servings \u003e 0);\n        }\n    }\n\n    #[test]\n    fn test_generate_additional_recipes() {\n        let base = vec![RecipeTemplate {\n            title: \"Base Recipe\".to_string(),\n            description: \"Description\".to_string(),\n            category: Category::Dinner,\n            cuisine: Cuisine::Italian,\n            prep_time: 10,\n            cook_time: 20,\n            servings: 4,\n            ingredients: vec![\"test\".to_string()],\n            instructions: vec![\"test\".to_string()],\n        }];\n\n        let all_recipes = generate_additional_recipes(\u0026base, 10);\n        assert_eq!(all_recipes.len(), 10);\n    }\n}\n","traces":[{"line":21,"address":[2447328],"length":1,"stats":{"Line":1}},{"line":22,"a ngth":1,"stats":{"Line":0}},{"line":1029,"address":[2444625,2445097],"length":1,"stats":{"Line":0}},{"line":1030,"address":[2445276,2445205],"length":1,"stats":{"Line":0}},{"line":1031,"address":[2445353,2445309],"length":1,"stats":{"Line":0}},{"line":1035,"address":[2444663],"length":1,"stats":{"Line":0}},{"line":1036,"address":[2444704,2444934],"length":1,"stats":{"Line":0}},{"line":1038,"address":[2444754],"length":1,"stats":{"Line":0}},{"line":1045,"address":[2444907],"length":1,"stats":{"Line":0}}],"covered":148,"coverable":215},{"path":["/","home","runner","work","monorepo","monorepo","cookbook","recipe_gen","src","migration_validator.rs"],"content":"use std::collections::HashSet;\nuse std::fs;\nuse std::path::{Path, PathBuf};\nuse uuid::Uuid;\n\n/// Validates that recipe and plan migration completed successfully\n///\n/// This tool verifies:\n/// - All recipe files have valid UUIDs in frontmatter\n/// - All recipe files are named with their UUID (no day-*.md files)\n/// - All plan files have Recipe UUIDs field\n/// - All recipe UUIDs in plan files reference existing recipe files\n/// - No orphaned day-*.md files exist\npub struct MigrationValidator {\n    content_dir: PathBuf,\n}\n\n#[derive(Debug, Default)]\npub struct ValidationReport {\n    pub total_recipe_files: usize,\n    pub recipes_with_uuid: usize,\n    pub recipes_with_uuid_name: usize,\n    pub day_named_files: Vec\u003cString\u003e,\n    pub recipes_missing_uuid: Vec\u003cString\u003e,\n    pub recipes_with_invalid_uuid: Vec\u003cString\u003e,\n    pub total_plan_files: usize,\n    pub plans_with_uuids: usize,\n    pub plans_missing_uuids: Vec\u003cString\u003e,\n    pub orphaned_recipe_refs: Vec\u003cString\u003e,\n    pub errors: Vec\u003cString\u003e,\n}\n\nimpl ValidationReport {\n    /// Returns true if the migration validation passed\n    pub fn is_valid(\u0026self) -\u003e bool {\n        self.day_named_files.is_empty()\n            \u0026\u0026 self.recipes_missing_uuid.is_empty()\n            \u0026\u0026 self.recipes_with_invalid_uuid.is_empty()\n            \u0026\u0026 self.plans_missing_uuids.is_empty()\n            \u0026\u0026 self.orphaned_recipe_refs.is_empty()\n            \u0026\u0026 self.errors.is_empty()\n    }\n\n    /// Returns a human-readable summary of the validation\n    pub fn summary(\u0026self) -\u003e String {\n        let mut output = String::new();\n        output.push_str(\"Migration Validation Report\\n\");\n        output.push_str(\"===========================\\n\\n\");\n\n        // Recipe validation\n        output.push_str(\"Recipe Files:\\n\");\n        output.push_str(\u0026format!(\n            \"  Total files found: {}\\n\",\n            self.total_recipe_files\n        ));\n        output.push_str(\u0026format!(\"  Files with UUID: {}\\n\", self.recipes_with_uuid));\n        output.push_str(\u0026format!(\n            \"  Files with UUID-based names: {}\\n\",\n            self.recipes_with_uuid_name\n        ));\n\n        if !self.day_named_files.is_empty() {\n            output.push_str(\u0026format!(\n                \"\\n  ⚠ {} files still have day-based names:\\n\",\n                self.day_named_files.len()\n            ));\n            for file in \u0026self.day_named_files {\n                output.push_str(\u0026format!(\"    - {}\\n\", file));\n            }\n        }\n\n        if !self.recipes_missing_uuid.is_empty() {\n            output.push_str(\u0026format!(\n                \"\\n  ⚠ {} files missing UUID:\\n\",\n                self.recipes_missing_uuid.len()\n            ));\n            for file in \u0026self.recipes_missing_uuid {\n                output.push_str(\u0026format!(\"    - {}\\n\", file));\n            }\n        }\n\n        if !self.recipes_with_invalid_uuid.is_empty() {\n            output.push_str(\u0026format!(\n                \"\\n  ⚠ {} files with invalid UUID:\\n\",\n                self.recipes_with_invalid_uuid.len()\n            ));\n            for file in \u0026self.recipes_with_invalid_uuid {\n                output.push_str(\u0026format!(\"    - {}\\n\", file));\n            }\n        }\n\n        // Plan validation\n        output.push_str(\"\\nPlan Files:\\n\");\n        output.push_str(\u0026format!(\"  Total files found: {}\\n\", self.total_plan_files));\n        output.push_str(\u0026format!(\n            \"  Files with Recipe UUIDs: {}\\n\",\n            self.plans_with_uuids\n        ));\n\n        if !self.plans_missing_uuids.is_empty() {\n            output.push_str(\u0026format!(\n                \"\\n  ⚠ {} files missing Recipe UUIDs:\\n\",\n                self.plans_missing_uuids.len()\n            ));\n            for file in \u0026self.plans_missing_uuids {\n                output.push_str(\u0026format!(\"    - {}\\n\", file));\n            }\n        }\n\n        if !self.orphaned_recipe_refs.is_empty() {\n            output.push_str(\u0026format!(\n                \"\\n  ⚠ {} recipe UUIDs reference non-existent files:\\n\",\n                self.orphaned_recipe_refs.len()\n            ));\n            for uuid in \u0026self.orphaned_recipe_refs {\n                output.push_str(\u0026format!(\"    - {}\\n\", uuid));\n            }\n        }\n\n        // Errors\n        if !self.errors.is_empty() {\n            output.push_str(\u0026format!(\"\\nErrors ({}):\\n\", self.errors.len()));\n            for error in \u0026self.errors {\n                output.push_str(\u0026format!(\"  ⚠ {}\\n\", error));\n            }\n        }\n\n        // Overall result\n        output.push('\\n');\n        if self.is_valid() {\n            output.push_str(\"✓ Migration validation PASSED\\n\");\n            output.push_str(\"  All recipe and plan files are properly migrated.\\n\");\n        } else {\n            output.push_str(\"✗ Migration validation FAILED\\n\");\n            output.push_str(\"  Some files require attention.\\n\");\n        }\n\n        output\n    }\n}\n\nimpl MigrationValidator {\n    /// Creates a new MigrationValidator for the given content directory\n    pub fn new\u003cP: AsRef\u003cPath\u003e\u003e(content_dir: P) -\u003e Result\u003cSelf, String\u003e {\n        let content_dir = content_dir.as_ref().to_path_buf();\n\n        if !content_dir.exists() {\n            return Err(format!(\n                \"Content directory does not exist: {}\",\n                content_dir.display()\n            ));\n        }\n\n        Ok(Self { content_dir })\n    }\n\n    /// Validates the migration and returns a report\n    pub fn validate(\u0026self) -\u003e Result\u003cValidationReport, String\u003e {\n        let mut report = ValidationReport::default();\n\n        // Collect all recipe UUIDs for cross-reference validation\n        let recipe_uuids = self.collect_recipe_uuids(\u0026mut report)?;\n\n        // Validate recipes\n        self.validate_recipes(\u0026mut report)?;\n\n        // Validate plans\n        self.validate_plans(\u0026mut report, \u0026recipe_uuids)?;\n\n        Ok(report)\n    }\n\n    /// Collects all valid recipe UUIDs from recipe files\n    fn collect_recipe_uuids(\u0026self, report: \u0026mut ValidationReport) -\u003e Result\u003cHashSet\u003cUuid\u003e, String\u003e {\n        let mut uuids = HashSet::new();\n\n        let entries = fs::read_dir(\u0026self.content_dir)\n            .map_err(|e| format!(\"Failed to read content directory: {}\", e))?;\n\n        for entry in entries {\n            let entry = entry.map_err(|e| format!(\"Failed to read directory entry: {}\", e))?;\n            let path = entry.path();\n\n            // Check for UUID-named files\n            if let Some(file_name) = path.file_stem().and_then(|s| s.to_str())\n                \u0026\u0026 path.extension().and_then(|s| s.to_str()) == Some(\"md\")\n            {\n                // Try to parse filename as UUID\n                if let Ok(uuid) = Uuid::parse_str(file_name) {\n                    // Verify the file content has the same UUID\n                    match self.extract_uuid_from_content(\u0026path) {\n                        Ok(content_uuid) =\u003e {\n                            if content_uuid == uuid {\n                                uuids.insert(uuid);\n                            } else {\n                                report.errors.push(format!(\n                                    \"File {} has mismatched UUID: filename={}, content={}\",\n                                    file_name, uuid, content_uuid\n                                ));\n                            }\n                        }\n                        Err(_) =\u003e {\n                            // Will be caught in validate_recipes\n                        }\n                    }\n                }\n            }\n        }\n\n        Ok(uuids)\n    }\n\n    /// Validates all recipe files\n    fn validate_recipes(\u0026self, report: \u0026mut ValidationReport) -\u003e Result\u003c(), String\u003e {\n        let entries = fs::read_dir(\u0026self.content_dir)\n            .map_err(|e| format!(\"Failed to read content directory: {}\", e))?;\n\n        for entry in entries {\n            let entry = entry.map_err(|e| format!(\"Failed to read directory entry: {}\", e))?;\n            let path = entry.path();\n\n            if path.extension().and_then(|s| s.to_str()) != Some(\"md\") {\n                continue;\n            }\n\n            let file_name = path\n                .file_stem()\n                .and_then(|s| s.to_str())\n                .unwrap_or(\"\u003cunknown\u003e\");\n\n            // Check if this is a recipe file (either day-*.md or UUID.md)\n            let is_day_file = file_name.starts_with(\"day-\");\n            let is_uuid_file = Uuid::parse_str(file_name).is_ok();\n            let is_week_file = file_name.starts_with(\"week-\");\n\n            // Only process recipe files (not plan files)\n            if (!is_day_file \u0026\u0026 !is_uuid_file) || is_week_file {\n                continue;\n            }\n\n            report.total_recipe_files += 1;\n\n            // Check if file has day-based name\n            if is_day_file {\n                report.day_named_files.push(file_name.to_string());\n            }\n\n            // Check if file has UUID-based name\n            if is_uuid_file {\n                report.recipes_with_uuid_name += 1;\n            }\n\n            // Check if content has UUID\n            match self.extract_uuid_from_content(\u0026path) {\n                Ok(_uuid) =\u003e {\n                    report.recipes_with_uuid += 1;\n                }\n                Err(e) =\u003e {\n                    if e.contains(\"No UUID found\") {\n                        report.recipes_missing_uuid.push(file_name.to_string());\n                    } else {\n                        report\n                            .recipes_with_invalid_uuid\n                            .push(format!(\"{}: {}\", file_name, e));\n                    }\n                }\n            }\n        }\n\n        Ok(())\n    }\n\n    /// Validates all plan files\n    fn validate_plans(\n        \u0026self,\n        report: \u0026mut ValidationReport,\n        recipe_uuids: \u0026HashSet\u003cUuid\u003e,\n    ) -\u003e Result\u003c(), String\u003e {\n        let entries = fs::read_dir(\u0026self.content_dir)\n            .map_err(|e| format!(\"Failed to read content directory: {}\", e))?;\n\n        for entry in entries {\n            let entry = entry.map_err(|e| format!(\"Failed to read directory entry: {}\", e))?;\n            let path = entry.path();\n\n            // Only process week-*.md files\n            if let Some(file_name) = path.file_stem().and_then(|s| s.to_str())\n                \u0026\u0026 file_name.starts_with(\"week-\")\n                \u0026\u0026 path.extension().and_then(|s| s.to_str()) == Some(\"md\")\n            {\n                report.total_plan_files += 1;\n\n                match self.extract_plan_uuids(\u0026path) {\n                    Ok(plan_uuids) =\u003e {\n                        report.plans_with_uuids += 1;\n\n                        // Check if all plan UUIDs reference existing recipes\n                        for uuid in plan_uuids {\n                            if !recipe_uuids.contains(\u0026uuid) {\n                                report.orphaned_recipe_refs.push(format!(\n                                    \"{} references non-existent recipe {}\",\n                                    file_name, uuid\n                                ));\n                            }\n                        }\n                    }\n                    Err(e) =\u003e {\n                        if e.contains(\"No Recipe UUIDs found\") {\n                            report.plans_missing_uuids.push(file_name.to_string());\n                        } else {\n                            report\n                                .errors\n                                .push(format!(\"Error processing {}: {}\", file_name, e));\n                        }\n                    }\n                }\n            }\n        }\n\n        Ok(())\n    }\n\n    /// Extracts the UUID from a recipe file's content\n    fn extract_uuid_from_content(\u0026self, path: \u0026Path) -\u003e Result\u003cUuid, String\u003e {\n        let content =\n            fs::read_to_string(path).map_err(|e| format!(\"Failed to read file: {}\", e))?;\n\n        for line in content.lines() {\n            let trimmed = line.trim();\n            if let Some(uuid_str) = trimmed.strip_prefix(\"UUID:\") {\n                let uuid_str = uuid_str.trim();\n                return Uuid::parse_str(uuid_str)\n                    .map_err(|e| format!(\"Invalid UUID format: {}\", e));\n            }\n        }\n\n        Err(\"No UUID found in file\".to_string())\n    }\n\n    /// Extracts recipe UUIDs from a plan file's content\n    fn extract_plan_uuids(\u0026self, path: \u0026Path) -\u003e Result\u003cVec\u003cUuid\u003e, String\u003e {\n        let content =\n            fs::read_to_string(path).map_err(|e| format!(\"Failed to read file: {}\", e))?;\n\n        for line in content.lines() {\n            let trimmed = line.trim();\n            if let Some(uuids_str) = trimmed.strip_prefix(\"Recipe UUIDs:\") {\n                let uuids: Result\u003cVec\u003cUuid\u003e, _\u003e = uuids_str\n                    .split(',')\n                    .map(|s| Uuid::parse_str(s.trim()))\n                    .collect();\n\n                return uuids.map_err(|e| format!(\"Failed to parse recipe UUIDs: {}\", e));\n            }\n        }\n\n        Err(\"No Recipe UUIDs found in plan file\".to_string())\n    }\n}\n\nfn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    println!(\"Migration Validation Tool\");\n    println!(\"=========================\\n\");\n\n    let content_dir = \"../content\";\n\n    // Check if content directory exists\n    if !Path::new(content_dir).exists() {\n        eprintln!(\"Error: Content directory '{}' does not exist\", content_dir);\n        eprintln!(\"Please run this tool from the cookbook/recipe_gen directory\");\n        std::process::exit(1);\n    }\n\n    println!(\"Validating migration in '{}'...\\n\", content_dir);\n\n    let validator = MigrationValidator::new(content_dir)?;\n    let report = validator.validate()?;\n\n    println!(\"{}\", report.summary());\n\n    if !report.is_valid() {\n        std::process::exit(1);\n    }\n\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use std::io::Write;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_validation_passes_with_fully_migrated_content() {\n        let temp_dir = TempDir::new().unwrap();\n\n        // Create properly migrated recipe files\n        let uuid1 = Uuid::new_v4();\n        let uuid2 = Uuid::new_v4();\n\n        for uuid in [uuid1, uuid2] {\n            let recipe_path = temp_dir.path().join(format!(\"{}.md\", uuid));\n            let mut file = fs::File::cre :[1034526],"length":1,"stats":{"Line":0}},{"line":374,"address":[1034537],"length":1,"stats":{"Line":0}},{"line":376,"address":[1034650],"length":1,"stats":{"Line":0}},{"line":377,"address":[1035464,1034940,1034877],"length":1,"stats":{"Line":0}},{"line":379,"address":[1035194,1035139],"length":1,"stats":{"Line":0}},{"line":381,"address":[1035354],"length":1,"stats":{"Line":0}},{"line":382,"address":[1035375],"length":1,"stats":{"Line":0}},{"line":385,"address":[1035391],"length":1,"stats":{"Line":0}}],"covered":121,"coverable":164},{"path":["/","home","runner","work","monorepo","monorepo","cookbook","recipe_gen","src","plan_uuid_migration.rs"],"content":"use cookbook_core::RecipeReader;\nuse cookbook_data_md::MarkdownRecipeStore;\nuse std::fs;\nuse std::path::{Path, PathBuf};\nuse uuid::Uuid;\n\n/// Migrates plan markdown files to use UUID-based recipe references\n///\n/// This tool reads all plan markdown files (week-*.md) in the content directory,\n/// extracts the day-based recipe references, looks up the corresponding recipe UUIDs,\n/// and updates the plan files to include UUID-based references.\npub struct PlanUuidMigrator {\n    content_dir: PathBuf,\n}\n\n#[derive(Debug)]\npub struct MigrationStats {\n    pub total_files: usize,\n    pub already_had_uuids: usize,\n    pub added_uuids: usize,\n    pub failed: usize,\n}\n\nimpl PlanUuidMigrator {\n    /// Creates a new PlanUuidMigrator for the given content directory\n    pub fn new\u003cP: AsRef\u003cPath\u003e\u003e(content_dir: P) -\u003e Result\u003cSelf, String\u003e {\n        let content_dir = content_dir.as_ref().to_path_buf();\n\n        if !content_dir.exists() {\n            return Err(format!(\n                \"Content directory does not exist: {}\",\n                content_dir.display()\n            ));\n        }\n\n        Ok(Self { content_dir })\n    }\n\n    /// Runs the migration on all plan files in the content directory\n    pub fn migrate(\u0026self) -\u003e Result\u003cMigrationStats, String\u003e {\n        let mut stats = MigrationStats {\n            total_files: 0,\n            already_had_uuids: 0,\n            added_uuids: 0,\n            failed: 0,\n        };\n\n        // Load recipe store to look up UUIDs by day\n        let recipe_store = MarkdownRecipeStore::new(\u0026self.content_dir)\n            .map_err(|e| format!(\"Failed to load recipe store: {}\", e))?;\n\n        // Get all week-*.md files\n        let entries = fs::read_dir(\u0026self.content_dir)\n            .map_err(|e| format!(\"Failed to read content directory: {}\", e))?;\n\n        for entry in entries {\n            let entry = entry.map_err(|e| format!(\"Failed to read directory entry: {}\", e))?;\n            let path = entry.path();\n\n            // Only process week-*.md files\n            if let Some(file_name) = path.file_stem().and_then(|s| s.to_str())\n                \u0026\u0026 file_name.starts_with(\"week-\")\n                \u0026\u0026 path.extension().and_then(|s| s.to_str()) == Some(\"md\")\n            {\n                stats.total_files += 1;\n                match self.migrate_file(\u0026path, \u0026recipe_store) {\n                    Ok(true) =\u003e stats.added_uuids += 1,\n                    Ok(false) =\u003e stats.already_had_uuids += 1,\n                    Err(e) =\u003e {\n                        eprintln!(\"Error migrating {}: {}\", path.display(), e);\n                        stats.failed += 1;\n                    }\n                }\n            }\n        }\n\n        Ok(stats)\n    }\n\n    /// Migrates a single plan file to include UUID-based recipe references\n    /// Returns Ok(true) if UUIDs were added, Ok(false) if UUIDs already existed\n    fn migrate_file(\n        \u0026self,\n        path: \u0026Path,\n        recipe_store: \u0026MarkdownRecipeStore,\n    ) -\u003e Result\u003cbool, String\u003e {\n        let content =\n            fs::read_to_string(path).map_err(|e| format!(\"Failed to read file: {}\", e))?;\n\n        // Check if UUIDs already exist in the content\n        if self.has_recipe_uuids(\u0026content) {\n            return Ok(false);\n        }\n\n        // Extract day numbers from the plan\n        let days = self.extract_days(\u0026content)?;\n\n        // Look up recipe UUIDs for each day\n        let mut recipe_uuids = Vec::new();\n        for day in \u0026days {\n            let day_id = format!(\"day-{}\", day);\n            let recipe = recipe_store\n                .get_by_id(\u0026day_id)\n                .map_err(|e| format!(\"Failed to find recipe for day {}: {}\", day, e))?;\n            recipe_uuids.push(recipe.uuid);\n        }\n\n        // Add recipe UUIDs to the content\n        let new_content = self.add_recipe_uuids_to_content(\u0026content, \u0026recipe_uuids);\n\n        // Write back to file\n        fs::write(path, new_content).map_err(|e| format!(\"Failed to write file: {}\", e))?;\n\n        Ok(true)\n    }\n\n    /// Checks if the content already has a Recipe UUIDs field\n    fn has_recipe_uuids(\u0026self, content: \u0026str) -\u003e bool {\n        for line in content.lines() {\n            if line.starts_with(\"Recipe UUIDs:\") {\n                return true;\n            }\n        }\n        false\n    }\n\n    /// Extracts day numbers from the plan content\n    fn extract_days(\u0026self, content: \u0026str) -\u003e Result\u003cVec\u003cu32\u003e, String\u003e {\n        for line in content.lines() {\n            let trimmed = line.trim();\n            if let Some(days_str) = trimmed.strip_prefix(\"Days:\") {\n                let days: Result\u003cVec\u003cu32\u003e, _\u003e = days_str\n                    .split(',')\n                    .map(|s| s.trim().parse::\u003cu32\u003e())\n                    .collect();\n\n                return days.map_err(|e| format!(\"Failed to parse day numbers: {}\", e));\n            }\n        }\n\n        Err(\"Could not find 'Days:' line in plan markdown\".to_string())\n    }\n\n    /// Adds recipe UUID references to the plan content\n    /// The UUIDs are inserted after the Days line for backward compatibility\n    fn add_recipe_uuids_to_content(\u0026self, content: \u0026str, recipe_uuids: \u0026[Uuid]) -\u003e String {\n        let mut lines: Vec\u003cString\u003e = content.lines().map(|s| s.to_string()).collect();\n\n        // Find the Days line\n        let days_index = lines\n            .iter()\n            .position(|line| line.trim().starts_with(\"Days:\"));\n\n        if let Some(days_idx) = days_index {\n            // Format the UUIDs as a comma-separated list\n            let uuids_str = recipe_uuids\n                .iter()\n                .map(|u| u.to_string())\n                .collect::\u003cVec\u003c_\u003e\u003e()\n                .join(\", \");\n\n            // Insert Recipe UUIDs line after the Days line\n            lines.insert(days_idx + 1, format!(\"Recipe UUIDs: {}\", uuids_str));\n        } else {\n            // If no Days line found, insert at the beginning of metadata section\n            // Find the \"Week:\" line and insert after it\n            let week_index = lines\n                .iter()\n                .position(|line| line.trim().starts_with(\"Week:\"));\n\n            if let Some(week_idx) = week_index {\n                let uuids_str = recipe_uuids\n                    .iter()\n                    .map(|u| u.to_string())\n                    .collect::\u003cVec\u003c_\u003e\u003e()\n                    .join(\", \");\n                // Insert after Year line (which should be after Week line)\n                let insert_pos = week_idx + 2;\n                if insert_pos \u003c lines.len() {\n                    lines.insert(insert_pos, format!(\"Recipe UUIDs: {}\", uuids_str));\n                } else {\n                    lines.push(format!(\"Recipe UUIDs: {}\", uuids_str));\n                }\n            }\n        }\n\n        // Join lines back together\n        lines.join(\"\\n\")\n    }\n}\n\nfn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    println!(\"Plan UUID Migration Tool\");\n    println!(\"========================\\n\");\n\n    let content_dir = \"../content\";\n\n    // Check if content directory exists\n    if !Path::new(content_dir).exists() {\n        eprintln!(\"Error: Content directory '{}' does not exist\", content_dir);\n        eprintln!(\"Please run this tool from the cookbook/recipe_gen directory\");\n        std::process::exit(1);\n    }\n\n    println!(\"Migrating plan files in '{}'...\\n\", content_dir);\n    println!(\"This tool will add 'Recipe UUIDs:' references to plan files\");\n    println!(\"based on the day numbers in each plan.\\n\");\n\n    let migrator = PlanUuidMigrator::new(content_dir)?;\n    let stats = migrator.migrate()?;\n\n    println!(\"\\nMigration Complete!\");\n    println!(\"===================\");\n    println!(\"Total plan files found: {}\", stats.total_files);\n    println!(\"Already had UUIDs:      {}\", stats.already_had_uuids);\n    println!(\"UUIDs added:            {}\", stats.added_uuids);\n    println!(\"Failed:                 {}\", stats.failed);\n\n    if stats.failed \u003e 0 {\n        eprintln!(\"\\n⚠ Warning: {} files failed to migrate\", stats.failed);\n        std::process::exit(1);\n    }\n\n    if stats.added_uuids \u003e 0 {\n        println!(\n            \"\\n✓ Successfully added recipe UUIDs to {} plan files\",\n            stats.added_uuids\n        );\n        println!(\"\\nNext steps:\");\n        println!(\"  1. Update plan parser to read 'Recipe UUIDs:' line\");\n        println!(\"  2. Update tests to validate UUID-based plan loading\");\n        println!(\"  3. Consider deprecating day-based references in future\");\n    } else {\n        println!(\"\\n✓ All plan files already have recipe UUID references\");\n    }\n\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use std::io::Write;\n    use tempfile::TempDir;\n\n ":"use std::fs;\nuse std::path::{Path, PathBuf};\nuse uuid::Uuid;\n\n/// Migrates recipe markdown files to include UUID frontmatter\n///\n/// This tool reads all recipe markdown files (day-*.md) in the content directory,\n/// generates a UUID for each recipe (or preserves existing UUIDs), and adds the\n/// UUID field to the frontmatter of each file.\npub struct UuidMigrator {\n    content_dir: PathBuf,\n}\n\n#[derive(Debug)]\npub struct MigrationStats {\n    pub total_files: usize,\n    pub already_had_uuid: usize,\n    pub added_uuid: usize,\n    pub failed: usize,\n}\n\nimpl UuidMigrator {\n    /// Creates a new UuidMigrator for the given content directory\n    pub fn new\u003cP: AsRef\u003cPath\u003e\u003e(content_dir: P) -\u003e Result\u003cSelf, String\u003e {\n        let content_dir = content_dir.as_ref().to_path_buf();\n\n        if !content_dir.exists() {\n            return Err(format!(\n                \"Content directory does not exist: {}\",\n                content_dir.display()\n            ));\n        }\n\n        Ok(Self { content_dir })\n    }\n\n    /// Runs the migration on all recipe files in the content directory\n    pub fn migrate(\u0026self) -\u003e Result\u003cMigrationStats, String\u003e {\n        let mut stats = MigrationStats {\n            total_files: 0,\n            already_had_uuid: 0,\n            added_uuid: 0,\n            failed: 0,\n        };\n\n        // Get all day-*.md files\n        let entries = fs::read_dir(\u0026self.content_dir)\n            .map_err(|e| format!(\"Failed to read content directory: {}\", e))?;\n\n        for entry in entries {\n            let entry = entry.map_err(|e| format!(\"Failed to read directory entry: {}\", e))?;\n            let path = entry.path();\n\n            // Only process day-*.md files\n            if let Some(file_name) = path.file_stem().and_then(|s| s.to_str())\n                \u0026\u0026 file_name.starts_with(\"day-\")\n                \u0026\u0026 path.extension().and_then(|s| s.to_str()) == Some(\"md\")\n            {\n                stats.total_files += 1;\n                match self.migrate_file(\u0026path) {\n                    Ok(true) =\u003e stats.added_uuid += 1,\n                    Ok(false) =\u003e stats.already_had_uuid += 1,\n                    Err(e) =\u003e {\n                        eprintln!(\"Error migrating {}: {}\", path.display(), e);\n                        stats.failed += 1;\n                    }\n                }\n            }\n        }\n\n        Ok(stats)\n    }\n\n    /// Migrates a single recipe file to include a UUID\n    /// Returns Ok(true) if UUID was added, Ok(false) if UUID already existed\n    fn migrate_file(\u0026self, path: \u0026Path) -\u003e Result\u003cbool, String\u003e {\n        let content =\n            fs::read_to_string(path).map_err(|e| format!(\"Failed to read file: {}\", e))?;\n\n        // Check if UUID already exists in the content\n        if self.has_uuid(\u0026content) {\n            return Ok(false);\n        }\n\n        // Generate a new UUID\n        let uuid = Uuid::new_v4();\n\n        // Add UUID to the content\n        let new_content = self.add_uuid_to_content(\u0026content, uuid);\n\n        // Write back to file\n        fs::write(path, new_content).map_err(|e| format!(\"Failed to write file: {}\", e))?;\n\n        Ok(true)\n    }\n\n    /// Checks if the content already has a UUID field\n    fn has_uuid(\u0026self, content: \u0026str) -\u003e bool {\n        for line in content.lines() {\n            if line.starts_with(\"UUID:\") {\n                return true;\n            }\n        }\n        false\n    }\n\n    /// Adds a UUID field to the recipe content\n    /// The UUID is inserted after the title and before the description\n    fn add_uuid_to_content(\u0026self, content: \u0026str, uuid: Uuid) -\u003e String {\n        let mut lines: Vec\u003cString\u003e = content.lines().map(|s| s.to_string()).collect();\n\n        // Find the title line (first line starting with \"# \")\n        let title_index = lines.iter().position(|line| line.trim().starts_with(\"# \"));\n\n        if let Some(title_idx) = title_index {\n            // Insert UUID after the title line\n            // We add an empty line, the UUID line, and another empty line for formatting\n            lines.insert(title_idx + 1, String::new());\n            lines.insert(title_idx + 2, format!(\"UUID: {}\", uuid));\n            lines.insert(title_idx + 3, String::new());\n        } else {\n            // If no title found, insert at the beginning\n            lines.insert(0, format!(\"UUID: {}\", uuid));\n            lines.insert(1, String::new());\n        }\n\n        // Join lines back together\n        lines.join(\"\\n\")\n    }\n}\n\nfn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    println!(\"UUID Migration Tool\");\n    println!(\"===================\\n\");\n\n    let content_dir = \"../content\";\n\n    // Check if content directory exists\n    if !Path::new(content_dir).exists() {\n        eprintln!(\"Error: Content directory '{}' does not exist\", content_dir);\n        eprintln!(\"Please run this tool from the cookbook/recipe_gen directory\");\n        std::process::exit(1);\n    }\n\n    println!(\"Migrating recipe files in '{}'...\\n\", content_dir);\n\n    let migrator = UuidMigrator::new(content_dir)?;\n    let stats = migrator.migrate()?;\n\n    println!(\"\\nMigration Complete!\");\n    println!(\"===================\");\n    println!(\"Total recipe files found: {}\", stats.total_files);\n    println!(\"Already had UUIDs:        {}\", stats.already_had_uuid);\n    println!(\"UUIDs added:              {}\", stats.added_uuid);\n    println!(\"Failed:                   {}\", stats.failed);\n\n    if stats.failed \u003e 0 {\n        eprintln!(\"\\n⚠ Warning: {} files failed to migrate\", stats.failed);\n        std::process::exit(1);\n    }\n\n    if stats.added_uuid \u003e 0 {\n        println!(\n            \"\\n✓ Successfully added UUIDs to {} recipe files\",\n            stats.added_uuid\n        );\n    } else {\n        println!(\"\\n✓ All recipe files already have UUIDs\");\n    }\n\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use std::io::Write;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_has_uuid_true() {\n        let migrator = UuidMigrator::new(\".\").unwrap();\n        let content = \"# Recipe Title\\n\\nUUID: 123e4567-e89b-12d3-a456-426614174000\\n\\nDescription\";\n        assert!(migrator.has_uuid(content));\n    }\n\n    #[test]\n    fn test_has_uuid_false() {\n        let migrator = UuidMigrator::new(\".\").unwrap();\n        let content = \"# Recipe Title\\n\\nDescription\";\n        assert!(!migrator.has_uuid(content));\n    }\n\n    #[test]\n    fn test_add_uuid_to_content() {\n        let migrator = UuidMigrator::new(\".\").unwrap();\n        let content = \"# Recipe Title\\n\\nDescription here\\n\\n## Ingredients\";\n        let uuid = Uuid::parse_str(\"123e4567-e89b-12d3-a456-426614174000\").unwrap();\n\n        let new_content = migrator.add_uuid_to_content(content, uuid);\n\n        assert!(new_content.contains(\"UUID: 123e4567-e89b-12d3-a456-426614174000\"));\n        assert!(new_content.contains(\"# Recipe Title\"));\n        assert!(new_content.contains(\"Description here\"));\n    }\n\n    #[test]\n    fn test_migrate_file() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"day-1.md\");\n\n        // Create a test recipe file\n        let mut file = fs::File::create(\u0026file_path).unwrap();\n        writeln!(file, \"# Test Recipe\").unwrap();\n        writeln!(file).unwrap();\n        writeln!(file, \"A delicious test recipe\").unwrap();\n\n        let migrator = UuidMigrator::new(temp_dir.path()).unwrap();\n\n        // First migration should add UUID\n        let result = migrator.migrate_file(\u0026file_path).unwrap();\n        assert!(result, \"Should return true when UUID is added\");\n\n        // Verify UUID was added\n        let content = fs::read_to_string(\u0026file_path).unwrap();\n        assert!(content.contains(\"UUID: \"));\n\n        // Second migration should skip (UUID already exists)\n        let result = migrator.migrate_file(\u0026file_path).unwrap();\n        assert!(!result, \"Should return false when UUID already exists\");\n    }\n\n    #[test]\n    fn test_migrate_all_files() {\n        let temp_dir = TempDir::new().unwrap();\n\n        // Create test recipe files\n        for i in 1..=5 {\n            let file_path = temp_dir.path().join(format!(\"day-{}.md\", i));\n            let mut file = fs::File::create(\u0026file_path).unwrap();\n            writeln!(file, \"# Recipe {}\", i).unwrap();\n            writeln!(file).unwrap();\n            writeln!(file, \"Description for recipe {}\", i).unwrap();\n        }\n\n        // Create a non-recipe file that should be ignored\n        let other_file = temp_dir.path().join(\"intro.md\");\n        fs::write(\u0026other_file, \"# Introduction\\n\").unwrap();\n\n        let migrator = UuidMigrator::new(temp_dir.path()).unwrap();\n        let stats = migrator.migrate().unwrap();\n\n        assert_eq!(stats.total_files, 5);\n        assert_eq!(stats.added_uuid, 5);\n        assert_eq!(stats.already_had_uuid, 0);\n        assert_eq!(stats.failed, 0);\n\n        // Verify all files have UUIDs\n        for i in 1..=5 {\n            let file_path = temp_dir.path().join(format!(\"day-{}.md\", i));\n            let content = fs::read_to_string(\u0026file_path).unwrap();\n            assert!(content.contains(\"UUID: \"));\n        }\n\n        // Verify intro.md was not modified\n        let intro_content = fs::read_to_string(\u0026other_file).unwrap();\n        assert_eq!(intro_content, \"# Introduction\\n\");\n    }\n}\n","traces":[{"line":24,"address":[],"length":0,"stats":{"Line":4}},{"line":25,"address":[],"length":0,"stats":{"Line":8}} ired fields\n            let mut issues = Vec::new();\n\n            if recipe.id.is_empty() {\n                issues.push(\"empty id\");\n            }\n            if recipe.title.is_empty() {\n                issues.push(\"empty title\");\n            }\n            if recipe.ingredients.is_empty() {\n                issues.push(\"no ingredients\");\n            }\n            if recipe.instructions.is_empty() {\n                issues.push(\"no instructions\");\n            }\n\n            if !issues.is_empty() {\n                invalid_recipes.push((day, issues));\n            }\n        }\n    }\n\n    assert!(\n        invalid_recipes.is_empty(),\n        \"Invalid recipes found: {:?}\",\n        invalid_recipes\n    );\n}\n\n#[test]\nfn test_all_day_recipes_have_proper_tags() {\n    let content_dir = \"../content\";\n    let store = MarkdownRecipeStore::new(content_dir)\n        .unwrap_or_else(|e| panic!(\"Failed to create recipe store: {}\", e));\n\n    let mut recipes_without_tags = Vec::new();\n    let all_recipes = RecipeReader::get_all(\u0026store).unwrap();\n\n    for day in 1..=365 {\n        let day_tag = format!(\"day-{}\", day);\n        if let Some(recipe) = all_recipes.iter().find(|r| r.tags.contains(\u0026day_tag)) {\n            if recipe.tags.is_empty() {\n                recipes_without_tags.push(day);\n            } else {\n                // Verify the recipe has the day tag\n                assert!(\n                    recipe.tags.contains(\u0026day_tag),\n                    \"Recipe for day {} is missing the {} tag\",\n                    day,\n                    day_tag\n                );\n            }\n        }\n    }\n\n    assert!(\n        recipes_without_tags.is_empty(),\n        \"Recipes without tags: {:?}\",\n        recipes_without_tags\n    );\n}\n\n#[test]\nfn test_recipe_variety_across_categories() {\n    let content_dir = \"../content\";\n    let store = MarkdownRecipeStore::new(content_dir)\n        .unwrap_or_else(|e| panic!(\"Failed to create recipe store: {}\", e));\n\n    let mut category_counts = std::collections::HashMap::new();\n    let all_recipes = RecipeReader::get_all(\u0026store).unwrap();\n\n    for day in 1..=365 {\n        let day_tag = format!(\"day-{}\", day);\n        if let Some(recipe) = all_recipes.iter().find(|r| r.tags.contains(\u0026day_tag)) {\n            for tag in \u0026recipe.tags {\n                let tag_lower = tag.to_lowercase();\n                if [\n                    \"breakfast\",\n                    \"lunch\",\n                    \"dinner\",\n                    \"dessert\",\n                    \"snack\",\n                    \"appetizer\",\n                    \"soup\",\n                    \"salad\",\n                    \"beverage\",\n                ]\n                .contains(\u0026tag_lower.as_str())\n                {\n                    *category_counts.entry(tag_lower).or_insert(0) += 1;\n                }\n            }\n        }\n    }\n\n    // Verify we have at least some variety (should have multiple categories)\n    assert!(\n        category_counts.len() \u003e= 5,\n        \"Not enough category variety. Found: {:?}\",\n        category_counts\n    );\n}\n\n#[test]\nfn test_recipe_variety_across_cuisines() {\n    let content_dir = \"../content\";\n    let store = MarkdownRecipeStore::new(content_dir)\n        .unwrap_or_else(|e| panic!(\"Failed to create recipe store: {}\", e));\n\n    let mut cuisine_counts = std::collections::HashMap::new();\n    let all_recipes = RecipeReader::get_all(\u0026store).unwrap();\n\n    for day in 1..=365 {\n        let day_tag = format!(\"day-{}\", day);\n        if let Some(recipe) = all_recipes.iter().find(|r| r.tags.contains(\u0026day_tag)) {\n            for tag in \u0026recipe.tags {\n                let tag_lower = tag.to_lowercase();\n                if [\n                    \"american\",\n                    \"italian\",\n                    \"chinese\",\n                    \"mexican\",\n                    \"indian\",\n                    \"japanese\",\n                    \"french\",\n                    \"thai\",\n                    \"greek\",\n                    \"spanish\",\n                    \"middle-eastern\",\n                    \"korean\",\n                    \"vietnamese\",\n                    \"mediterranean\",\n                    \"caribbean\",\n                ]\n                .contains(\u0026tag_lower.as_str())\n                {\n                    *cuisine_counts.entry(tag_lower).or_insert(0) += 1;\n                }\n            }\n        }\n    }\n\n    // Verify we have at least some variety (should have multiple cuisines)\n    assert!(\n        cuisine_counts.len() \u003e= 5,\n        \"Not enough cuisine variety. Found: {:?}\",\n        cuisine_counts\n    );\n}\n\n#[test]\nfn test_recipe_ids_are_valid_uuids() {\n    let content_dir = \"../content\";\n    let store = MarkdownRecipeStore::new(content_dir)\n        .unwrap_or_else(|e| panic!(\"Failed to create recipe store: {}\", e));\n\n    let all_recipes = RecipeReader::get_all(\u0026store).unwrap();\n\n    for day in 1..=365 {\n        let day_tag = format!(\"day-{}\", day);\n        if let Some(recipe) = all_recipes.iter().find(|r| r.tags.contains(\u0026day_tag)) {\n            // After migration, recipe IDs should be valid UUIDs\n            assert!(\n                uuid::Uuid::parse_str(\u0026recipe.id).is_ok(),\n                \"Recipe for day {} has invalid UUID id: {}\",\n                day,\n                recipe.id\n            );\n\n            // But the recipe should still have the day tag\n            let expected_tag = format!(\"day-{}\", day);\n            assert!(\n                recipe.tags.contains(\u0026expected_tag),\n                \"Recipe for day {} should have tag '{}' in tags: {:?}\",\n                day,\n                expected_tag,\n                recipe.tags\n            );\n        }\n    }\n}\n","traces":[{"li
