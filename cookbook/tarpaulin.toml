# Tarpaulin Configuration for Cookbook Project
# Run with: cargo tarpaulin

[tarpaulin]
# Run tests for all workspace members
workspace = true

# Exclude test files from coverage calculations (including member test directories)
exclude-files = [
    "**/tests/*",
]

# Output formats
# HTML report is generated as tarpaulin-report.html in the cookbook directory
# Stdout shows a summary in the terminal
out = ["Html", "Stdout"]

# Follow child processes (useful for integration tests)
follow-exec = true

# Workspace policy: fail if coverage drops below this threshold (80%, informed by standards/docs/testing.md)
# Note: Current coverage is ~76%, so this will fail until coverage is improved
# Set to 76.0 temporarily if you want passing builds, then incrementally raise it
fail-under = 80.0

# Timeout for tests (in seconds)
timeout = 120

# Enable branch coverage (more detailed than line coverage)
# Note: This may increase runtime significantly
# branch = true
