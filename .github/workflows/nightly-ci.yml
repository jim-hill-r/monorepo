---
# Runs `mise run ci` in every project each night, so breakage from new
# toolchains or dependency releases shows up even in quiet projects.
name: Nightly CI

'on':
  schedule:
    # 2 AM Pacific Time (10 AM UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/mise-projects.yml
    with:
      base: ''
