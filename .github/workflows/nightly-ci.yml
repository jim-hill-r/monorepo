---
# Each night: `mise run ci` in every project, even quiet ones, so toolchain
# drift and dependency releases show up within a day. Nightly CD
# (nightly-cd.yml) redeploys the sites separately, so the README has one badge
# for each.
name: Nightly CI

'on':
  schedule:
    # 2 AM Pacific Time (10 AM UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/mise-projects.yml
    with:
      base: ''

  # Commit the eval results to the evals-results branch, even when a
  # project failed, so failing evals are kept too.
  store-evals:
    needs: ci
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/evals-store.yml
    permissions:
      contents: write
