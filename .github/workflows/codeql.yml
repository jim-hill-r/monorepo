---
name: CodeQL Security Scanning

'on':
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    # Run weekly on Mondays at 6:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  detect-and-scan:
    # Skip if PR was closed without merging
    if: >-
      github.event_name == 'schedule' ||
      github.event.pull_request.merged == true ||
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use merge commit if PR was merged, otherwise use PR head
          # For scheduled runs, checkout default branch
          ref: >-
            ${{
              github.event_name == 'schedule' && github.ref ||
              (github.event.pull_request.merged &&
              github.event.pull_request.merge_commit_sha ||
              github.event.pull_request.head.sha)
            }}

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build cast CLI
        run: |
          cd cast/cli
          cargo build --release

      - name: Find projects with changes
        id: changed-projects
        run: |
          CAST_BIN="$GITHUB_WORKSPACE/cast/target/release/cast"
          
          # For scheduled runs, scan all projects
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Running scheduled scan - analyzing all projects with TypeScript/JavaScript"
            # Find all projects with package.json (indicates TypeScript/JavaScript)
            CHANGED_PROJECTS=$(find . -name "package.json" -not -path "*/node_modules/*" \
              -exec dirname {} \; | sort -u)
          else
            # For PR events, only scan changed projects
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"

            # Validate SHA format (40 hex characters)
            if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
               ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Error: Invalid SHA format"
              exit 1
            fi

            # Explicitly fetch both base and head commits to ensure they're available
            echo "Fetching base commit: $BASE_SHA"
            git fetch origin "$BASE_SHA" || true
            echo "Fetching head commit: $HEAD_SHA"
            git fetch origin "$HEAD_SHA" || true

            # Verify commits are available
            echo "Verifying commits are available..."
            if ! git cat-file -e "$BASE_SHA" 2>/dev/null || \
               ! git cat-file -e "$HEAD_SHA" 2>/dev/null; then
              echo "Error: One or both commits not available after checkout"
              git log --oneline --all -10
              exit 1
            fi
            echo "Commits verified successfully"

            # Use cast CLI to find projects with changes
            ALL_CHANGED=$("$CAST_BIN" project with-changes \
              --base "$BASE_SHA" --head "$HEAD_SHA" 2>&1)

            # Check if the command failed
            if [ $? -ne 0 ]; then
              echo "Error: cast project with-changes command failed"
              echo "Output: $ALL_CHANGED"
              exit 1
            fi

            # Filter to only projects with package.json (TypeScript/JavaScript)
            CHANGED_PROJECTS=""
            if [ -n "$ALL_CHANGED" ]; then
              for project in $ALL_CHANGED; do
                if [ -f "$project/package.json" ]; then
                  CHANGED_PROJECTS="$CHANGED_PROJECTS$project"$'\n'
                fi
              done
            fi
          fi

          if [ -z "$CHANGED_PROJECTS" ]; then
            echo "No projects with TypeScript/JavaScript code found"
            echo "has_projects=false" >> $GITHUB_OUTPUT
          else
            echo "Projects to scan:"
            echo "$CHANGED_PROJECTS"
            # Convert to JSON array for iteration
            PROJECTS_JSON=$(echo "$CHANGED_PROJECTS" | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "projects=$PROJECTS_JSON" >> $GITHUB_OUTPUT
            echo "has_projects=true" >> $GITHUB_OUTPUT
          fi

      - name: Initialize CodeQL
        if: steps.changed-projects.outputs.has_projects == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Specify paths to scan based on changed projects
          # This will be overridden per-project in the analysis step

      - name: Run CodeQL analysis for changed projects
        if: steps.changed-projects.outputs.has_projects == 'true'
        run: |
          PROJECTS='${{ steps.changed-projects.outputs.projects }}'
          echo "Running CodeQL analysis for projects: $PROJECTS"

          EXIT_CODE=0
          for project in $(echo "$PROJECTS" | jq -r '.[]'); do
            echo "::group::Analyzing $project with CodeQL"
            
            # Skip if project doesn't have TypeScript/JavaScript files
            if ! find "$project" -name "*.ts" -o -name "*.js" -o -name "*.tsx" -o -name "*.jsx" 2>/dev/null | grep -q .; then
              echo "⊘ Skipping $project - no TypeScript/JavaScript files found"
              echo "::endgroup::"
              continue
            fi
            
            echo "✓ Found TypeScript/JavaScript files in $project"
            echo "::endgroup::"
          done

          exit $EXIT_CODE

      - name: Perform CodeQL Analysis
        if: steps.changed-projects.outputs.has_projects == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      - name: No projects to scan
        if: steps.changed-projects.outputs.has_projects != 'true'
        run: echo "No projects with TypeScript/JavaScript code were changed in this PR"
