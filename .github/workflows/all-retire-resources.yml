name: All Retire Resources

# Deletes temporary resources ("Temporary resources" in
# standards/docs/resources.md): rebuilt from git, so no one is asked.
# - Pages preview deployments older than 14 days, keeping the newest one of
#   each branch with an open PR.
# - Pages production deployments older than 30 days, never the current one.
# - Branches 7 days after their PR closed, through all-delete-branches.yml,
#   so the manual workflow and this one share the same guards (default
#   branch, evals-results, open PRs).
# Branches with no PR are never deleted here: the sweep lists them and the
# digest asks Jim. The rules are `chores retire-temporary`
# (chores/src/retire.rs); this workflow only lists and deletes.
#
# Also deletes approved resources ("Safe deletion order" in
# standards/docs/resources.md): `[[retired]]` entries in
# standards/resources.toml past their delete_after date. Jim approving the
# PR that added an entry is the approval. Only Pages projects today (the
# deploy token has Pages Write); `chores retire-approved`
# (chores/src/retire_approved.rs) holds an entry that is still claimed on
# main, had a production deploy in the last 7 days or is still named by an
# open human task, and never deletes anything only because it is unclaimed.
#
# Weekly an hour after the sweep in all-free-tier-usage.yml, for real. A
# manual run is a dry run unless dry_run is set to false, and approved
# resources are deleted only from the default branch.
on:
  schedule:
    # Mondays at 4 PM UTC (8 AM Pacific), after the 3 PM sweep.
    - cron: '0 16 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: retire-resources
  cancel-in-progress: false

jobs:
  temporary:
    name: Temporary resources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branches: ${{ steps.plan.outputs.branches }}
      dry-run: ${{ steps.plan.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List live resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/retire"
          mkdir -p "$out"

          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' \
            | jq -R . | jq -s . >"$out/branches.json"
          gh api --paginate "repos/$REPO/pulls?state=all&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.REPO)
                  | {number, head: .head.ref, state, closed_at}' \
            | jq -s . >"$out/pulls.json"

          echo '[]' >"$out/pages.json"
          pages_listed=false
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::No Cloudflare secrets: Pages deployments are not checked"
          else
            api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
            cf() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
            cf "$api?per_page=100" | jq -c '.result[] | {name, canonical: (.canonical_deployment.id // "")}' >"$out/projects.jsonl"
            while IFS= read -r project; do
              name=$(jq -r .name <<<"$project")
              : >"$out/deployments.jsonl"
              page=1
              while :; do
                body=$(cf "$api/$name/deployments?per_page=25&page=$page")
                jq -c '.result[] | {id, environment, branch: (.deployment_trigger.metadata.branch // ""), created_on}' <<<"$body" >>"$out/deployments.jsonl"
                [ "$(jq '.result | length' <<<"$body")" -eq 25 ] || break
                page=$((page + 1))
              done
              jq -s --argjson p "$project" '$p + {deployments: .}' "$out/deployments.jsonl" >"$out/project.json"
              jq --slurpfile p "$out/project.json" '. + $p' "$out/pages.json" >"$out/pages.next" && mv "$out/pages.next" "$out/pages.json"
            done <"$out/projects.jsonl"
            pages_listed=true
          fi

          jq -n --arg default_branch "$DEFAULT_BRANCH" --argjson pages_listed "$pages_listed" \
            --slurpfile branches "$out/branches.json" --slurpfile pulls "$out/pulls.json" --slurpfile pages "$out/pages.json" \
            '{default_branch: $default_branch, pages_listed: $pages_listed, branches: $branches[0], pulls: $pulls[0], pages: $pages[0]}' >"$out/live.json"

      - name: Plan
        id: plan
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/retire"
          cargo run --quiet --manifest-path chores/Cargo.toml -- --root "$GITHUB_WORKSPACE" \
            retire-temporary --live "$out/live.json" --json "$out/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "branches=$(jq -r '[.branches[].name] | join(" ")' "$out/plan.json")"
            echo "dry-run=$DRY_RUN"
          } >>"$GITHUB_OUTPUT"

      - name: Delete Pages deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ steps.plan.outputs.dry-run }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/retire/plan.json"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:-}/pages/projects"
          deleted=0; failed=0
          while IFS=$'\t' read -r project id environment; do
            [ -n "$id" ] || continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete: $project $environment deployment $id"
              deleted=$((deleted + 1)); continue
            fi
            # force=true also removes a closed branch's alias URL; the
            # newest preview of an open PR's branch is never in the plan.
            if curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api/$project/deployments/$id?force=true" >/dev/null; then
              echo "Deleted: $project $environment deployment $id"
              deleted=$((deleted + 1))
            else
              echo "::error::Failed to delete $project deployment $id"
              failed=$((failed + 1))
            fi
          done < <(jq -r '.deployments[] | [.project, .id, .environment] | @tsv' "$plan")
          verb=$([ "$DRY_RUN" = "true" ] && echo "Would delete" || echo "Deleted")
          {
            echo "### Pages deployments"
            echo "- $verb: $deleted"
            echo "- Failed: $failed"
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: Plan approved deletions
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/retire"
          bash standards/scripts/resources.sh claims >"$out/claims.tsv"
          cargo run --quiet --manifest-path chores/Cargo.toml -- --root "$GITHUB_WORKSPACE" \
            retire-approved --live "$out/live.json" --claims "$out/claims.tsv" \
            --json "$out/approved.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # Step 3 of the safe order: delete the Pages project, which removes
      # every deployment and preview alias with it. Never the Worker of the
      # same name (a different API path). The next sweep confirms it is gone
      # and the digest sets `deleted`.
      - name: Delete approved Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ steps.plan.outputs.dry-run }}
          ON_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/retire/approved.json"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:-}/pages/projects"
          if [ "$ON_DEFAULT" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::warning::Approved resources are deleted only from the default branch; this run only reports"
            DRY_RUN=true
          fi
          deleted=0; failed=0
          while IFS=$'\t' read -r kind name; do
            [ "$kind" = "pages" ] || continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete: Pages project $name"
              deleted=$((deleted + 1)); continue
            fi
            if curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$name" >/dev/null \
                && [ "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$name")" = "404" ]; then
              echo "Deleted: Pages project $name"
              deleted=$((deleted + 1))
            else
              echo "::error::Failed to delete Pages project $name"
              failed=$((failed + 1))
            fi
          done < <(jq -r '.delete[] | [.kind, .name] | @tsv' "$plan")
          verb=$([ "$DRY_RUN" = "true" ] && echo "Would delete" || echo "Deleted")
          {
            echo "### Approved Pages projects"
            echo "- $verb: $deleted"
            echo "- Failed: $failed"
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

  branches:
    name: Branches of closed PRs
    needs: temporary
    if: ${{ needs.temporary.outputs.branches != '' }}
    permissions:
      contents: write      # delete branch refs
      pull-requests: read  # skip branches with open PRs
    uses: ./.github/workflows/all-delete-branches.yml
    with:
      branches: ${{ needs.temporary.outputs.branches }}
      dry_run: ${{ needs.temporary.outputs.dry-run == 'true' }}
