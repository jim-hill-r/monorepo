---
name: Push Main CI

'on':
  push:
    branches:
      - main
    paths-ignore:
      - '**/artifacts/**'

permissions:
  contents: write

jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Run CI release on changed projects
        run: |
          cargo install --path ./cast/cli
          cast ci --only-changed --release --recursive 2  --headless

      - name: Commit and push artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only add artifacts directories that exist and have changes
          # Use glob pattern to add all artifacts directories
          git add --ignore-errors -- '*/artifacts/*' || true
          
          if git diff --staged --quiet; then
            echo "No artifacts to commit"
          else
            echo "Committing artifacts:"
            git diff --staged --name-only
            git commit -m "chore: update release artifacts [skip ci]"
            git push
          fi
