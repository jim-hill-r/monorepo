name: Standards Audit

'on':
  schedule:
    # Run at 3 AM UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  standards-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build standards CLI
        run: cargo build --release --manifest-path standards/Cargo.toml

      - name: Run standards audit-to-issues
        run: ./standards/target/release/standards audit-to-issues --path .

      - name: Create PR with audit results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes detected, skipping PR creation"
            exit 0
          fi
          BRANCH="standards-audit-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: Update ISSUES.md files with standards audit results"
          git push origin "$BRANCH"
          gh pr create \
            --title "Standards Audit: Update ISSUES.md files" \
            --body "Automated standards audit results. These TODOs were generated by running the standards CLI against all projects." \
            --base main \
            --head "$BRANCH" \
            --assignee jim-hill-r
