name: All Free Tier Usage

# Checks the live usage of the services the repo runs on (Cloudflare Pages
# and Workers counts, GitHub Actions cache and artifact storage) against the
# budgets in standards/docs/free-tiers.md, and goes red when anything reaches
# its warning level. It only reads; it never creates, deletes or upgrades
# anything. The nightly run is to call it first and stop if it fails.
#
# A `billing` job checks, with read-only billing credentials, that
# Cloudflare, GitHub and PostHog still have no payment method, paid plan or
# charge (standards/scripts/billing-check.sh).
#
# The same weekly run scans the whole git history for secrets (SEC-001, the
# threat check's full-history scan, standards/docs/security.md), so a new
# gitleaks rule catches an old commit within a week.
#
# A `repo-security` job fails if private vulnerability reporting is turned
# off; the `github` infra stack holds the other code security settings.
#
# A `threat-live` job compares what is deployed on Cloudflare with the
# threat models (standards/scripts/threat-live.sh, "Live check" in
# standards/docs/security.md): unclaimed Pages projects or Workers, sites
# behind Access that aren't, APIs that answer without a token and public
# sites missing security headers. Same read-only token as `usage`.
on:
  schedule:
    # Mondays at 3 PM UTC (7 AM Pacific)
    - cron: '0 15 * * 1'
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read
  actions: read  # cache usage and artifact sizes

concurrency:
  group: free-tier-usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check usage against free tier budgets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash standards/scripts/free-tiers.sh usage

  # Read-only billing credentials prove there is still no payment method,
  # paid plan or charge where the vendor's API can show it
  # (standards/scripts/billing-check.sh, Jim, 2026-11-27). They are secrets
  # of the `infra` environment, which only `main` can use, so no PR branch
  # ever gets them. A credential that isn't made yet is a warning.
  billing:
    name: Billing check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No payment method, paid plan or charge
        env:
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_BILLING_READ_TOKEN: ${{ secrets.GITHUB_BILLING_READ_TOKEN }}
          GITHUB_BILLING_USER: ${{ github.repository_owner }}
          POSTHOG_BILLING_READ_KEY: ${{ secrets.POSTHOG_BILLING_READ_KEY }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST || 'https://us.posthog.com' }}
        run: bash standards/scripts/billing-check.sh all

  secrets-history:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: gitleaks over every commit
        env:
          GITHUB_TOKEN: ${{ github.token }}  # mise's gitleaks download
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: bash standards/scripts/secrets-check.sh history

  # Private vulnerability reporting has no OpenTofu resource, so the
  # `github` infra stack can't hold it on. Anyone can read it on a public
  # repo, so this needs no admin token ("GitHub security settings" in
  # standards/docs/security.md).
  repo-security:
    name: GitHub security settings
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Private vulnerability reporting is on
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          enabled=$(gh api "repos/$REPO/private-vulnerability-reporting" --jq .enabled)
          if [ "$enabled" != "true" ]; then
            echo "::error::Private vulnerability reporting is off; turn it on (standards/docs/runbooks/github-code-security.md)"
            exit 1
          fi
          echo "Private vulnerability reporting is on." >>"$GITHUB_STEP_SUMMARY"

  threat-live:
    name: Live threat check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deployed sites against their threat models
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          THREAT_LIVE_OUT: ${{ runner.temp }}/threat-live
        run: bash standards/scripts/threat-live.sh

      # The issue files for unclaimed deployments, for PR triage to commit
      # (standards/docs/repo-health.md); CI never pushes to main.
      - name: Keep the report and issue files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threat-live
          path: |
            ${{ runner.temp }}/threat-live/report.md
            ${{ runner.temp }}/threat-live/threat/docs/issues/
          if-no-files-found: ignore
          retention-days: 7
