name: All Free Tier Usage

# Daily cost check (cost tracking phase 1,
# standards/docs/plans/2026-11-cost-tracking.md). Reads the live usage of
# every free allowance an API shows (Cloudflare Pages projects, Workers,
# Cron Triggers, D1 databases and storage, R2 buckets, the busiest day's
# Workers requests and D1 rows, repo visibility, Actions cache and
# artifacts) and rates each on the green, yellow and red ladder against the
# budgets in standards/radar/limits.toml. Yellow is a warning in the run;
# red fails it, so the "Free tier usage" badge goes red within a day. It
# only reads; it never creates, deletes or upgrades anything. The nightly
# run is to call it first and stop if it fails.
#
# A `billing` job checks, with read-only billing credentials, that
# Cloudflare, GitHub and PostHog still have no payment method, paid plan or
# charge (standards/scripts/billing-check.sh), so a switched-on bill is
# found within a day too.
#
# The weekly full-history secret scan, the GitHub security settings and the
# live threat check are in all-security-scans.yml, so they stay weekly and
# a daily run can't hide their result on the badge.
on:
  schedule:
    # Every day at 7 AM UTC (11 PM Pacific), after the day's limits reset
    - cron: '0 7 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read
  actions: read  # cache usage and artifact sizes

concurrency:
  group: free-tier-usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check usage against free tier budgets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FREE_TIERS_JSON: ${{ runner.temp }}/free-tier-usage.json
        run: bash standards/scripts/free-tiers.sh usage

      # The same table as JSON, for pane's Money page to read from the
      # latest run (pane/issues, Phase 7 order 340). Kept even when an item
      # is over its budget, which is when it matters most.
      - name: Keep the usage as JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: free-tier-usage
          path: ${{ runner.temp }}/free-tier-usage.json
          if-no-files-found: ignore
          # The run is daily and pane reads the latest run's file.
          retention-days: 2

  # Read-only billing credentials prove there is still no payment method,
  # paid plan or charge where the vendor's API can show it
  # (standards/scripts/billing-check.sh, Jim, 2026-11-27). They are secrets
  # of the `infra` environment, which only `main` can use, so no PR branch
  # ever gets them. A credential that isn't made yet is a warning.
  billing:
    name: Billing check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No payment method, paid plan or charge
        env:
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_BILLING_READ_TOKEN: ${{ secrets.GITHUB_BILLING_READ_TOKEN }}
          GITHUB_BILLING_USER: ${{ github.repository_owner }}
          POSTHOG_BILLING_READ_KEY: ${{ secrets.POSTHOG_BILLING_READ_KEY }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST || 'https://us.posthog.com' }}
        run: bash standards/scripts/billing-check.sh all
