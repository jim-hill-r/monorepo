---
name: CD

'on':
  push:
    branches:
      - main
    paths:
      - '**/artifacts/x86_64-unknown-linux-gnu/**'

permissions:
  contents: read

jobs:
  run-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build cast CLI
        run: |
          cd cast/cli
          cargo build --release

      - name: Find projects with new Linux artifacts
        id: changed-projects
        run: |
          # Use absolute path to cast binary
          CAST_BIN="$GITHUB_WORKSPACE/cast/target/release/cast"

          # Get files changed in the last commit (which triggered this workflow)
          # Shows files added/modified in artifacts directories
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Find unique project directories from changed artifact files
          # Format: project/artifacts/x86_64-unknown-linux-gnu/* -> project
          PROJECTS=$(echo "$CHANGED_FILES" | \
            grep '/artifacts/x86_64-unknown-linux-gnu/' | \
            sed 's|/artifacts/x86_64-unknown-linux-gnu/.*||' | \
            sort -u)

          if [ -z "$PROJECTS" ]; then
            echo "No projects with new Linux artifacts found"
            echo "has_projects=false" >> $GITHUB_OUTPUT
          else
            echo "Projects with new Linux artifacts:"
            echo "$PROJECTS"
            # Convert to JSON array for iteration
            PROJECTS_JSON=$(echo "$PROJECTS" | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "projects=$PROJECTS_JSON" >> $GITHUB_OUTPUT
            echo "has_projects=true" >> $GITHUB_OUTPUT
          fi

      - name: Run cast cd for projects with new artifacts
        if: steps.changed-projects.outputs.has_projects == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GHA_CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
        run: |
          PROJECTS='${{ steps.changed-projects.outputs.projects }}'
          echo "Running cast cd for projects: $PROJECTS"

          # Use absolute path to cast binary
          CAST_BIN="$GITHUB_WORKSPACE/cast/target/release/cast"

          EXIT_CODE=0
          for project in $(echo "$PROJECTS" | jq -r '.[]'); do
            echo "::group::Installing toolchain for $project"
            cd "$GITHUB_WORKSPACE/$project"

            # Install required tools for this project
            if "$CAST_BIN" install; then
              echo "✓ Toolchain installed for $project"
            else
              echo "✗ Toolchain installation failed for $project"
              EXIT_CODE=1
              echo "::endgroup::"
              cd "$GITHUB_WORKSPACE"
              continue
            fi
            echo "::endgroup::"

            echo "::group::Running cast cd for $project"
            if "$CAST_BIN" cd; then
              echo "✓ cast cd completed for $project"
            else
              echo "✗ cast cd failed for $project"
              EXIT_CODE=1
            fi

            echo "::endgroup::"
            cd "$GITHUB_WORKSPACE"
          done

          exit $EXIT_CODE

      - name: No projects to deploy
        if: steps.changed-projects.outputs.has_projects != 'true'
        run: echo "No projects with new Linux artifacts found"
