---
# SEC-003, SEC-004, SEC-005 (standards/docs/security.md): cargo-deny and npm
# audit over every lockfile, and zizmor over every workflow, each night, so a
# new advisory for a quiet project shows up within a day. PR CI and the
# hooks run the same checks only where a lockfile or workflow changed.
# Warnings only for now: the run stays green, and findings are in its log
# as warning[SEC-003] / warning[SEC-004] / warning[SEC-005].
name: All Dependency Audit

'on':
  schedule:
    # 2:30 AM Pacific Time (10:30 AM UTC), after Nightly CI starts
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    name: Dependency audit (all lockfiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: cargo-deny and npm audit
        env:
          GITHUB_TOKEN: ${{ github.token }}  # mise's cargo-deny download
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: bash standards/scripts/deps-check.sh --all

      - name: zizmor
        env:
          GITHUB_TOKEN: ${{ github.token }}  # mise's zizmor download
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: bash standards/scripts/workflows-check.sh --all
