---
# On every push to main: `mise run ci` then `mise run deploy` in each project
# the push touched. Most projects' deploy task does nothing; the cloudflare
# projects build their web app and publish it to Cloudflare Pages. See
# mise-projects.yml and standards/docs/mise.md.
name: Push Main CI/CD

'on':
  push:
    branches:
      - main
  workflow_dispatch: # Checks and deploys every project

permissions:
  contents: read

# No concurrency group: GitHub keeps only one pending run per group and
# cancels the rest, which silently skipped CI and deploys for quick
# back-to-back merges. Each run checks and deploys only what its own push
# changed.

jobs:
  ci-cd:
    uses: ./.github/workflows/mise-projects.yml
    with:
      base: ${{ github.event_name == 'push' && github.event.before || '' }}
      deploy: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
