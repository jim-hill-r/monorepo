---
name: All CodeQL Security Scanning

# Advanced CodeQL setup (decision 0008). GitHub's default setup would scan
# Rust on every PR, which took about 26 minutes here (measured 2026-01, PR
# #382), so this workflow splits the languages by cost:
#
# - JavaScript/TypeScript (~1 minute) and Actions (~40 seconds) run on every
#   PR, every push to main and weekly.
# - Rust (CodeQL build-mode none, ~26 minutes) runs only weekly and by hand,
#   so PRs stay fast. Its alerts show in the Security tab like the others.
#
# PR-time Rust checks are clippy (`mise run ci`) and cargo-deny (SEC-003,
# standards/docs/security.md). Public repo: CodeQL and Actions minutes are
# free.

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Fast languages only; Rust is the weekly job below.
        language: ['javascript-typescript', 'actions']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"

  # Rust: weekly and by hand only (decision 0008).
  analyze-rust:
    name: Analyze (rust)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:rust"
