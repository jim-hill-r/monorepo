---
# Runs `mise run ci` in every project a pull request touches. See
# mise-projects.yml and standards/docs/mise.md.
name: Pull Request CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # Runs every project on the chosen branch

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/mise-projects.yml
    with:
      base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
