---
# Runs `mise run ci` in every project a pull request changes (affected.sh
# --changed-only: shared scripts and root config don't fan out to every
# project). See mise-projects.yml and standards/docs/mise.md.
name: Pull Request CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # Runs every project on the chosen branch

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/mise-projects.yml
    with:
      base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      changed_only: true

  # One check that always runs and passes only when every project passed, so
  # the ruleset on main can require it and GitHub auto-merge waits for green
  # CI. Project jobs have per-PR names, so they can't be required directly.
  ci-result:
    name: CI result
    needs: ci
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every project passed
        env:
          RESULT: ${{ needs.ci.result }}
        run: |
          echo "Pull Request CI: $RESULT"
          test "$RESULT" = success
