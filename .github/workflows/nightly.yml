---
name: Nightly CI

'on':
  schedule:
    # Run at 2 AM Pacific Time (10 AM UTC)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  nightly-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build cast CLI
        run: |
          cd cast/cli
          cargo build --release

      - name: Run cast ci recursively
        run: |
          # Use absolute path to cast binary
          CAST_BIN="$GITHUB_WORKSPACE/cast/target/release/cast"
          
          echo "Running cast ci --recursive 2 --check from repository root"
          cd "$GITHUB_WORKSPACE"
          
          if "$CAST_BIN" ci --recursive 2 --check; then
            echo "✓ Nightly CI passed"
          else
            echo "✗ Nightly CI failed"
            exit 1
          fi
