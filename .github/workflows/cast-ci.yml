---
name: Cast CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-and-run-ci:
    # Skip if PR was closed without merging
    if: >-
      github.event.pull_request.merged == true ||
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use merge commit if PR was merged, otherwise use PR head
          ref: >-
            ${{
              github.event.pull_request.merged &&
              github.event.pull_request.merge_commit_sha ||
              github.event.pull_request.head.sha
            }}

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build cast CLI
        run: |
          cd cast/cli
          cargo build --release

      - name: Run CI on changed projects
        run: |
          # Use absolute path to cast binary
          CAST_BIN="$GITHUB_WORKSPACE/cast/target/release/cast"
          
          # Run cast ci with --only-changed to check only projects with changes
          # and --recursive 2 to find all Cast projects up to 2 levels deep
          "$CAST_BIN" ci --only-changed --recursive 2
