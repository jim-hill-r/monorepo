name: All Security Scans

# Weekly security checks of what is already in the repo and deployed.
#
# The full git history is scanned for secrets (SEC-001, the threat check's
# full-history scan, standards/docs/security.md), so a new gitleaks rule
# catches an old commit within a week.
#
# A `repo-security` job fails if private vulnerability reporting is turned
# off; the `github` infra stack holds the other code security settings.
#
# A `threat-live` job compares what is deployed on Cloudflare with the
# threat models (standards/scripts/threat-live.sh, "Live check" in
# standards/docs/security.md): unclaimed Pages projects or Workers, sites
# behind Access that aren't, APIs that answer without a token and public
# sites missing security headers. Same read-only token as the usage check
# in all-free-tier-usage.yml.
on:
  schedule:
    # Mondays at 3 PM UTC (7 AM Pacific)
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scans
  cancel-in-progress: false

jobs:
  secrets-history:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false

      - name: gitleaks over every commit
        env:
          GITHUB_TOKEN: ${{ github.token }}  # mise's gitleaks download
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: bash standards/scripts/secrets-check.sh history

  # Private vulnerability reporting has no OpenTofu resource, so the
  # `github` infra stack can't hold it on. Anyone can read it on a public
  # repo, so this needs no admin token ("GitHub security settings" in
  # standards/docs/security.md).
  repo-security:
    name: GitHub security settings
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Private vulnerability reporting is on
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          enabled=$(gh api "repos/$REPO/private-vulnerability-reporting" --jq .enabled)
          if [ "$enabled" != "true" ]; then
            echo "::error::Private vulnerability reporting is off; turn it on (standards/docs/runbooks/github-code-security.md)"
            exit 1
          fi
          echo "Private vulnerability reporting is on." >>"$GITHUB_STEP_SUMMARY"

  threat-live:
    name: Live threat check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deployed sites against their threat models
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          THREAT_LIVE_OUT: ${{ runner.temp }}/threat-live
        run: bash standards/scripts/threat-live.sh

      # The issue files for unclaimed deployments, for PR triage to commit
      # (standards/docs/repo-health.md); CI never pushes to main.
      - name: Keep the report and issue files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threat-live
          path: |
            ${{ runner.temp }}/threat-live/report.md
            ${{ runner.temp }}/threat-live/issues/
          if-no-files-found: ignore
          retention-days: 7
