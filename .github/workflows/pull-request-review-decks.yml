# Builds the project review decks in docs/reviews/ to HTML and PDF with Marp
# (standards/scripts/review-decks.sh) and uploads them as the `review-decks`
# artifact, so a reviewer can read the slides without a local clone. See
# docs/reviews/README.md.
name: Review decks

'on':
  pull_request:
    paths:
      - 'docs/reviews/**'
      - 'standards/scripts/review-decks.sh'
      - '.github/workflows/pull-request-review-decks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-decks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build decks
        run: bash standards/scripts/review-decks.sh build/reviews

      - name: Upload decks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-decks
          path: build/reviews
          if-no-files-found: ignore
          retention-days: 90
