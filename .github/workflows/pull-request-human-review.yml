---
# PR-004, the `human-review` label (Jim, 2026-11-27: "Lets make sure no prs
# with red attention flags get auto merged. Cost changes must be reviewed by
# jim", then "Lets make it needs human review"). Since review roles phase 1
# (decision 0019), who may approve comes from standards/reviewers.toml, read
# from the base branch: a PR that changes a requirement or a cost, from its
# diff, its description or the `cost` label, is labelled `human-review`
# until a requirements-reviewer or cost-reviewer (today Jim) approves its
# head commit, and the label comes off then. Agent `-agt` accounts,
# jimhillr-reviewer and bots never hold a role. A PR a role holder opened is
# never labelled.
#
# This is not a CI check (Jim, 2026-11-28: the pending status "is
# preventing claude from marking PRs as ready for review and it shows CI as
# red which makes it hard for me to happily approve/rubber stamp a PR"). It
# posts no status and its job is green whenever it ran, so CI shows only
# real results. The label is what holds the PR: jimhillr-reviewer refuses
# it (and every protected path, such as cost.toml and requirements.md),
# agents never approve, so only a human's approval can merge it, and auto-
# merge stays on so that approval does. On a commit that still carries the
# `Human review` status an earlier version posted, it posts `success` once
# so the old pending status stops holding the PR.
# The rules are under "Human review" in standards/docs/pull-requests.md and
# the logic is `chores gate` (chores/src/gate.rs), built from the base
# branch so a PR can't change the rules it is judged by.
name: Human review

'on':
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

concurrency:
  group: pull-request-human-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Human review label
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write         # create the human-review label the first time
      pull-requests: write  # label and unlabel the PR
      statuses: write       # clear a Human review status an older version posted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The rules come from the base branch. Only until chores gate
          # first reaches it (the PR that adds it) is the PR's own copy used.
          git worktree add --detach "$RUNNER_TEMP/base" "origin/$BASE_REF" >/dev/null
          chores="$RUNNER_TEMP/base/chores"
          if [ ! -f "$chores/src/gate.rs" ]; then
            echo "origin/$BASE_REF has no chores gate yet; using this PR's." | tee -a "$GITHUB_STEP_SUMMARY"
            chores=chores
          fi
          # Read fresh from the API: labels set by other jobs, the current
          # description and every review.
          gh api "repos/$GH_REPO/pulls/$PR" --jq '.body // ""' >"$RUNNER_TEMP/body.md"
          labels=$(gh api "repos/$GH_REPO/issues/$PR/labels" --paginate --jq '.[].name' | paste -sd, -)
          gh api "repos/$GH_REPO/pulls/$PR/reviews" --paginate --jq '.[]' | jq -s . >"$RUNNER_TEMP/reviews.json"
          set +e
          cargo run --quiet --manifest-path "$chores/Cargo.toml" -- --root "$GITHUB_WORKSPACE" \
            gate --base "origin/$BASE_REF" --body "$RUNNER_TEMP/body.md" --labels "$labels" \
            --author "$AUTHOR" --author-association "$AUTHOR_ASSOCIATION" --head "$HEAD_SHA" --reviews "$RUNNER_TEMP/reviews.json" \
            --json "$RUNNER_TEMP/gate.json" | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          # Exit 1 is a verdict (waiting for a human), not a broken gate.
          [ -f "$RUNNER_TEMP/gate.json" ] || exit "${code:-1}"
          echo "needs-human=$(jq -r .needs_human "$RUNNER_TEMP/gate.json")" >>"$GITHUB_OUTPUT"
          echo "pass=$(jq -r .pass "$RUNNER_TEMP/gate.json")" >>"$GITHUB_OUTPUT"

      # Labels a held PR human-review, and takes the label off once a human
      # approves. Leaves needs-human and auto-merge alone: the human's
      # approval is what merges a held PR.
      - name: Label for a human
        if: steps.decide.outputs.needs-human == 'true'
        # A fork's or Dependabot's token can't label; the step summary says so,
        # and jimhillr-reviewer never approves those PRs anyway.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PASS: ${{ steps.decide.outputs.pass }}
        run: |
          if [ "$PASS" = true ]; then
            gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/human-review" >/dev/null 2>&1 || true
            echo "No human-review label (passed)"
          else
            gh api "repos/$GH_REPO/labels" -f name=human-review -f color=B60205 \
              -f description="Waiting for a review role's approval: requirement or cost change" >/dev/null 2>&1 || true
            gh api "repos/$GH_REPO/issues/$PR/labels" -f "labels[]=human-review" >/dev/null
            echo "Labelled human-review"
          fi

      # Until 2026-11-28 the gate posted a `Human review` commit status, and
      # a pending one would keep holding a PR. Overwrite it once; post
      # nothing on a commit that never had one.
      - name: Clear the old Human review status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          old=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/status" --jq '[.statuses[] | select(.context == "Human review")][0].state // ""')
          if [ -n "$old" ] && [ "$old" != success ]; then
            gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state=success -f context="Human review" \
              -f description="Retired: the human-review label holds this PR instead" >/dev/null
            echo "Cleared the old Human review status ($old)"
          fi
