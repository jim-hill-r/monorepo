---
# PR-004, the `Human review` check (Jim, 2026-11-27: "Lets make sure no prs
# with red attention flags get auto merged. Cost changes must be reviewed by
# jim", then "Lets make it needs human review"). A PR with a red attention
# tag (`must-requirement-changed`) or a cost change, from its diff, its
# description or the `cost` label, fails this check until a human approves
# its head commit. Only human collaborators count (owner, member or
# collaborator; Jim: "Any human collaborator is fine"): agent `-agt`
# accounts, jimhillr-reviewer and bots never do. A PR a human collaborator
# opened passes. While it waits, such a PR is labelled `human-review`
# (taken off again on approval); jimhillr-reviewer and agents never approve
# it, but its auto-merge stays on, so the human's approval merges it (Jim,
# 2026-11-28: "Yes, merge on my approval"). Every other PR passes. Runs again on every review, so a human's approval turns it green.
#
# The verdict is the `Human review` commit status, not this job's result
# (Jim, 2026-11-28: "I don't think that should block the merge once I
# approve"): `pending` (yellow) while it waits, `success` once a human
# approves, `failure` only when a human asks for changes. Each event runs
# this workflow again, and a failed check run from an earlier event would
# stay on the commit beside the passing one, so the PR looked red even
# after Jim approved it (PR 916). One status context replaces itself
# instead. The job is called `Human review gate` so its own check run never
# satisfies the required `Human review` context; it fails only when the
# gate itself breaks.
# The rules are under "Human review" in standards/docs/pull-requests.md and
# the logic is `chores gate` (chores/src/gate.rs), built from the base
# branch so a PR can't change the rules it is judged by.
name: Human review

'on':
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

concurrency:
  group: pull-request-human-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Human review gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write         # create the human-review label the first time
      pull-requests: write  # label and unlabel the PR
      statuses: write       # post the Human review commit status
    env:
      STATUS_CONTEXT: Human review
    steps:
      # A fork's token can't post statuses; the last step then fails the job.
      - name: Mark as checking
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Checking for red attention tags and cost changes" -f target_url="$RUN_URL" >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The rules come from the base branch. Only until chores gate
          # first reaches it (the PR that adds it) is the PR's own copy used.
          git worktree add --detach "$RUNNER_TEMP/base" "origin/$BASE_REF" >/dev/null
          chores="$RUNNER_TEMP/base/chores"
          if [ ! -f "$chores/src/gate.rs" ]; then
            echo "origin/$BASE_REF has no chores gate yet; using this PR's." | tee -a "$GITHUB_STEP_SUMMARY"
            chores=chores
          fi
          # Read fresh from the API: labels set by other jobs, the current
          # description and every review.
          gh api "repos/$GH_REPO/pulls/$PR" --jq '.body // ""' >"$RUNNER_TEMP/body.md"
          labels=$(gh api "repos/$GH_REPO/issues/$PR/labels" --paginate --jq '.[].name' | paste -sd, -)
          gh api "repos/$GH_REPO/pulls/$PR/reviews" --paginate --jq '.[]' | jq -s . >"$RUNNER_TEMP/reviews.json"
          set +e
          cargo run --quiet --manifest-path "$chores/Cargo.toml" -- --root "$GITHUB_WORKSPACE" \
            gate --base "origin/$BASE_REF" --body "$RUNNER_TEMP/body.md" --labels "$labels" \
            --author "$AUTHOR" --author-association "$AUTHOR_ASSOCIATION" --head "$HEAD_SHA" --reviews "$RUNNER_TEMP/reviews.json" \
            --json "$RUNNER_TEMP/gate.json" | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          # Exit 1 is a verdict (pending or failure), not a broken gate.
          [ -f "$RUNNER_TEMP/gate.json" ] || exit "${code:-1}"
          echo "needs-human=$(jq -r .needs_human "$RUNNER_TEMP/gate.json")" >>"$GITHUB_OUTPUT"
          echo "pass=$(jq -r .pass "$RUNNER_TEMP/gate.json")" >>"$GITHUB_OUTPUT"

      # Labels a held PR human-review, and takes the label off once a human
      # approves. Leaves needs-human and auto-merge alone: the human's
      # approval is what merges a held PR.
      - name: Label for a human
        if: steps.decide.outputs.needs-human == 'true'
        # A fork's or Dependabot's token can't label; the status still holds it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PASS: ${{ steps.decide.outputs.pass }}
        run: |
          if [ "$PASS" = true ]; then
            gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/human-review" >/dev/null 2>&1 || true
            echo "No human-review label (passed)"
          else
            gh api "repos/$GH_REPO/labels" -f name=human-review -f color=B60205 \
              -f description="Waiting for a human's approval: red attention tag or cost change" >/dev/null 2>&1 || true
            gh api "repos/$GH_REPO/issues/$PR/labels" -f "labels[]=human-review" >/dev/null
            echo "Labelled human-review"
          fi

      # The verdict. A pending status is the approval it waits for, not a
      # failure, so the job itself stays green.
      - name: Post the Human review status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A base branch whose chores gate predates `state` (only the PR
          # that adds it) gives just `pass`: waiting, not failed.
          state=$(jq -r '.state // (if .pass then "success" else "pending" end)' "$RUNNER_TEMP/gate.json")
          description=$(jq -r '.description // .line | .[0:140]' "$RUNNER_TEMP/gate.json")
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL" >/dev/null
          echo "Posted $STATUS_CONTEXT: $state ($description)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report a broken gate
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state=error -f context="$STATUS_CONTEXT" \
            -f description="The Human review gate failed; see the run" -f target_url="$RUN_URL" >/dev/null
