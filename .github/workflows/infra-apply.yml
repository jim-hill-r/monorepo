---
# Apply infra on main (decisions 0007, 0009 and 0010). For each stack:
#
# 1. plan: in the `infra` environment (state write password), with the
#    read-only vendor credentials, saving the encrypted plan, its SHA-256 and
#    the guard report (IAC-001 to IAC-005) as an artifact.
# 2. route: stacks without changes stop here; a stack with a credential
#    change goes to apply-credentials, every other changed stack to apply.
# 3. apply: in `infra`, with the apply credentials, exactly the saved plan.
#    apply-credentials: the same in `infra-credentials`, which waits for
#    Jim's approval (decision 0010).
#
# Every job shares the `infra` concurrency group with the state Worker's
# deploy and the drift check, so only one touches state at a time.
name: Infra Apply

'on':
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/infra-apply.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  stacks:
    runs-on: ubuntu-24.04
    outputs:
      stacks: ${{ steps.list.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "stacks=$(ls infra/out | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  plan:
    needs: stacks
    runs-on: ubuntu-24.04
    environment: infra
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.stacks) }}
    name: plan (${{ matrix.stack }})
    defaults:
      run:
        working-directory: infra
    env:
      TOFU_STATE_ORIGIN: ${{ vars.TOFU_STATE_ORIGIN }}
      TF_HTTP_PASSWORD: ${{ secrets.TOFU_STATE_WRITE_PASSWORD }}
      TOFU_STATE_PASSPHRASE: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      AUTH0_INFRA_READ_DOMAIN: ${{ secrets.AUTH0_INFRA_READ_DOMAIN }}
      AUTH0_INFRA_READ_CLIENT_ID: ${{ secrets.AUTH0_INFRA_READ_CLIENT_ID }}
      AUTH0_INFRA_READ_CLIENT_SECRET: ${{ secrets.AUTH0_INFRA_READ_CLIENT_SECRET }}
      CLOUDFLARE_INFRA_READ_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The github stack reads with a token from the read-only infra GitHub
      # App, minted for this run only
      # (standards/docs/runbooks/github-app-infra-read.md).
      - name: GitHub App token (github stack)
        id: gh-read
        if: matrix.stack == 'github' && vars.GH_INFRA_READ_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GH_INFRA_READ_APP_ID }}
          private-key: ${{ secrets.GH_INFRA_READ_APP_KEY }}
          repositories: ${{ github.event.repository.name }}

      - id: ready
        name: Check the stack is set up
        env:
          GH_INFRA_READ_TOKEN: ${{ steps.gh-read.outputs.token }}
        run: |
          if bash scripts/tofu.sh ready "${{ matrix.stack }}" read; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.stack }} is not set up yet, so nothing was planned or applied (see the human tasks in infra/docs/issues/human/)"
          fi

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.ready.outputs.ready == 'true'
        with:
          working_directory: infra

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.ready.outputs.ready == 'true'
        with:
          workspaces: infra

      - name: tofu plan and the plan guards
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_INFRA_READ_TOKEN: ${{ steps.gh-read.outputs.token }}
        run: bash scripts/tofu.sh plan "${{ matrix.stack }}" read "$RUNNER_TEMP/plan/${{ matrix.stack }}"

      # Only the encrypted plan, its hash and the results: never the JSON plan.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.ready.outputs.ready == 'true'
        with:
          name: plan-${{ matrix.stack }}
          path: |
            ${{ runner.temp }}/plan/${{ matrix.stack }}/plan.tfplan
            ${{ runner.temp }}/plan/${{ matrix.stack }}/plan.sha256
            ${{ runner.temp }}/plan/${{ matrix.stack }}/report.json
            ${{ runner.temp }}/plan/${{ matrix.stack }}/result
          retention-days: 1

  route:
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      apply: ${{ steps.route.outputs.apply }}
      credentials: ${{ steps.route.outputs.credentials }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          path: plans
      - id: route
        run: |
          apply=() credentials=()
          for dir in plans/plan-*/; do
            [ -f "$dir/result" ] || continue
            stack=$(basename "$dir"); stack=${stack#plan-}
            grep -q '^changes=yes' "$dir/result" || continue
            if grep -q '^credential_change=yes' "$dir/result"; then
              credentials+=("$stack")
            else
              apply+=("$stack")
            fi
          done
          echo "apply=$(printf '%s\n' "${apply[@]}" | jq -R 'select(length > 0)' | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "credentials=$(printf '%s\n' "${credentials[@]}" | jq -R 'select(length > 0)' | jq -cs .)" >> "$GITHUB_OUTPUT"

  apply:
    needs: route
    if: needs.route.outputs.apply != '[]'
    runs-on: ubuntu-24.04
    environment: infra
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.route.outputs.apply) }}
    name: apply (${{ matrix.stack }})
    defaults:
      run:
        working-directory: infra
    env:
      TOFU_STATE_ORIGIN: ${{ vars.TOFU_STATE_ORIGIN }}
      TF_HTTP_PASSWORD: ${{ secrets.TOFU_STATE_WRITE_PASSWORD }}
      TOFU_STATE_PASSPHRASE: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      AUTH0_INFRA_APPLY_DOMAIN: ${{ secrets.AUTH0_INFRA_APPLY_DOMAIN }}
      AUTH0_INFRA_APPLY_CLIENT_ID: ${{ secrets.AUTH0_INFRA_APPLY_CLIENT_ID }}
      AUTH0_INFRA_APPLY_CLIENT_SECRET: ${{ secrets.AUTH0_INFRA_APPLY_CLIENT_SECRET }}
      CLOUDFLARE_INFRA_APPLY_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_APPLY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-${{ matrix.stack }}
          path: ${{ runner.temp }}/plan
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: infra
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: infra
          save-if: false
      - name: tofu apply the saved plan
        run: bash scripts/tofu.sh apply "${{ matrix.stack }}" apply "$RUNNER_TEMP/plan"

  apply-credentials:
    needs: route
    if: needs.route.outputs.credentials != '[]'
    runs-on: ubuntu-24.04
    # Waits for Jim's approval: the second approval for credential changes.
    environment: infra-credentials
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.route.outputs.credentials) }}
    name: apply credentials (${{ matrix.stack }})
    defaults:
      run:
        working-directory: infra
    env:
      TOFU_STATE_ORIGIN: ${{ vars.TOFU_STATE_ORIGIN }}
      TF_HTTP_PASSWORD: ${{ secrets.TOFU_STATE_WRITE_PASSWORD }}
      TOFU_STATE_PASSPHRASE: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      AUTH0_INFRA_CREDENTIALS_DOMAIN: ${{ secrets.AUTH0_INFRA_CREDENTIALS_DOMAIN }}
      AUTH0_INFRA_CREDENTIALS_CLIENT_ID: ${{ secrets.AUTH0_INFRA_CREDENTIALS_CLIENT_ID }}
      AUTH0_INFRA_CREDENTIALS_CLIENT_SECRET: ${{ secrets.AUTH0_INFRA_CREDENTIALS_CLIENT_SECRET }}
      CLOUDFLARE_INFRA_CREDENTIALS_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_CREDENTIALS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Decision 0010: never apply unless this environment really waited
      # for Jim.
      - name: Stop unless infra-credentials needs an approval
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash infra/scripts/env-gate.sh infra-credentials
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-${{ matrix.stack }}
          path: ${{ runner.temp }}/plan
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: infra
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: infra
          save-if: false
      # The github stack applies with the infra GitHub App, whose key lives
      # only here (standards/docs/runbooks/github-app-infra.md).
      - name: GitHub App token (github stack)
        id: gh-credentials
        if: matrix.stack == 'github'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GH_INFRA_CREDENTIALS_APP_ID }}
          private-key: ${{ secrets.GH_INFRA_CREDENTIALS_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: tofu apply the saved plan
        env:
          GH_INFRA_CREDENTIALS_TOKEN: ${{ steps.gh-credentials.outputs.token }}
        run: bash scripts/tofu.sh apply "${{ matrix.stack }}" credentials "$RUNNER_TEMP/plan"
