---
# PR-001: warns when a pull request description doesn't open with a linked
# executive summary of at most 75 words (standards/docs/pull-requests.md,
# "Pull request descriptions"). Warnings only, so it never fails and CI
# result doesn't wait for it. Runs on edits too, so fixing the description
# clears the warning without re-running project CI.
name: PR summary

'on':
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summary:
    name: PR summary
    # Dependabot writes its own bodies (standards/docs/pull-requests.md).
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - name: Check the executive summary
        env:
          # Passed through the environment, never interpolated into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: mise run --quiet //:pr-summary
