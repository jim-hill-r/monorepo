# Dependabot version updates: one entry per lockfile.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# //:audit checks this file (SEC-006, standards/docs/security.md): every
# tracked Cargo.lock and package-lock.json has an entry for its directory, and
# every entry's directory exists and holds that lockfile. A Cargo workspace has
# one entry, at the workspace root that holds the Cargo.lock. Keep the
# `package-ecosystem:` line directly above `directory:`; the check reads them
# as a pair.
#
# Pinned dependencies (AGENTS.md, "Pinned dependencies") are ignored here so
# Dependabot never opens a bump for them.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/athenaeum/learning/computer_science/algorithms/neet_code_150"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "cargo"
    directory: "/auth_sdk"
