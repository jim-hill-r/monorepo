# design_system: threat model. Format and rules: standards/docs/security.md
reviewed = "2026-11-27"
summary = "Theme tokens, generated CSS and a Dioxus picker, with a static preview site on Pages. No sign-in, no data beyond the themes."

[[surface]]
name = "preview"
kind = "pages"
url = "https://jimhillr-design-system.pages.dev"
access = "public"
data = "public"
previews = "public"
notes = "Static build of the theme preview. No _headers file yet."

[[secret]]
name = "CLOUDFLARE_API_TOKEN"
where = "github"
used_by = ["mise-projects.yml deploy step"]
scope = "jimhillr-deploy: Pages, Workers Scripts and D1 Write, Account Analytics Read, this account only"
setting = "cloudflare-api-token-scopes"

[[secret]]
name = "CLOUDFLARE_ACCOUNT_ID"
where = "github"
used_by = ["mise-projects.yml deploy step"]
scope = "An identifier, not a credential; kept as a secret so logs never show it"
setting = "github-secret-cloudflare-account-id"

[[threat]]
id = "DS-T1"
stride = "tampering"
what = "Someone changes the preview or the shared CSS every app imports."
mitigation = "Only the deploy step on main can publish, main needs a reviewed PR, and apps build the CSS from the repo, not from the preview site."
surface = "preview"

[[threat]]
id = "DS-T2"
stride = "elevation-of-privilege"
what = "The preview is framed by another site (clickjacking) or loads injected script."
mitigation = "It loads only its own scripts and has no sign-in. Security headers are still missing (see the FIX issue)."
surface = "preview"
