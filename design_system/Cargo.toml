[workspace]
resolver = "2"
members = ["model", "cli", "palette"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
design_system_model = { path = "model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
