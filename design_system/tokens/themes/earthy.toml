# design_system/tokens/themes/earthy.toml: the Earthy theme.
# Primitives are this theme's palette; [light.color] and [dark.color] give
# every semantic colour token, as a #hex value, a primitive or another token.
# [accessible.*.color] overrides only what must change for WCAG AAA.

name = "earthy"
label = "Earthy"
description = "Warm, natural, handmade: parchment, dusty terracotta, walnut and sage, serif headings, soft corners and soft, layered warm shadows."

[type]
ratio = 1.25

[fonts]
heading = "ui-serif, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif"
body = "Seravek, 'Gill Sans Nova', Ubuntu, Calibri, 'DejaVu Sans', system-ui, sans-serif"

[tokens]
leading-body = "1.6"
radius-sm = "6px"
radius-md = "10px"
radius-lg = "16px"
shadow-1 = "0 1px 2px rgb(74 52 32 / 0.08), 0 1px 1px rgb(74 52 32 / 0.06)"
shadow-2 = "0 2px 4px rgb(74 52 32 / 0.06), 0 6px 14px rgb(74 52 32 / 0.08)"
shadow-3 = "0 4px 8px rgb(74 52 32 / 0.06), 0 14px 32px rgb(74 52 32 / 0.1)"

[primitives]
# Chosen in OKLCH: one warm hue family (h 40 to 80) with low chroma (0.01
# to 0.09) so nothing shouts, and no pure white or black. The reasoning and
# sources are in athenaeum/resources/design/.
sand-50 = "#f7f1e8"
sand-25 = "#fbf6ee"
paper = "#fffbf6"
cream = "#fdf8f0"
bark-900 = "#2b2118"
bark-600 = "#695b4c"
terracotta-600 = "#8c523b"
terracotta-700 = "#77422f"
terracotta-300 = "#dca37d"
terracotta-200 = "#e9b993"
soil-950 = "#1f1812"
soil-900 = "#2a2119"
linen-100 = "#f3e7d8"

[light.color]
