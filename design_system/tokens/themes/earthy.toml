# design_system/tokens/themes/earthy.toml: the Earthy theme.
# Primitives are this theme's palette; [light.color] and [dark.color] give
# every semantic colour token, as a #hex value, a primitive or another token.
# [accessible.*.color] overrides only what must change for WCAG AAA.

name = "earthy"
label = "Earthy"
description = "Warm, natural, handmade: clay, bark, sand and olive, serif headings, soft corners and warm low shadows."

[type]
ratio = 1.25

[fonts]
heading = "ui-serif, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif"
body = "Seravek, 'Gill Sans Nova', Ubuntu, Calibri, 'DejaVu Sans', system-ui, sans-serif"

[tokens]
leading-body = "1.6"
radius-sm = "6px"
radius-md = "10px"
radius-lg = "16px"
shadow-1 = "0 1px 2px rgb(60 36 14 / 0.14)"
shadow-2 = "0 3px 8px rgb(60 36 14 / 0.16)"
shadow-3 = "0 10px 28px rgb(60 36 14 / 0.2)"

[primitives]
sand-50 = "#f7f1e8"
sand-25 = "#fffaf3"
bark-900 = "#2b2118"
