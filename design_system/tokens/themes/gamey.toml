# design_system/tokens/themes/gamey.toml: the Gamey (8-bit) theme.
# Primitives are this theme's palette; [light.color] and [dark.color] give
# every semantic colour token, as a #hex value, a primitive or another token.
# [accessible.*.color] overrides only what must change for WCAG AAA.

name = "gamey"
label = "Gamey (8-bit)"
description = "Retro console, chunky: a small fixed palette of flat colours, a pixel font for headings, monospace body, square corners, hard borders and stepped shadows."

[type]
ratio = 1.25

[fonts]
# Press Start 2P (SIL Open Font License), self-hosted from
# design_system/dioxus/assets/design-system-fonts/.
heading = "'Press Start 2P', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
body = "ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"

[tokens]
leading-heading = "1.4"
radius-sm = "0"
radius-md = "0"
radius-lg = "0"
radius-pill = "0"
border-width = "2px"
shadow-1 = "2px 2px 0 0 rgb(8 24 32 / 0.8)"
shadow-2 = "4px 4px 0 0 rgb(8 24 32 / 0.8)"
shadow-3 = "6px 6px 0 0 rgb(8 24 32 / 0.8)"
ease = "steps(4, end)"

[primitives]
leaf-50 = "#e0f8d0"
leaf-100 = "#c8ecb4"
leaf-25 = "#e8fcd8"
leaf-400 = "#88c070"
ink-950 = "#081820"
