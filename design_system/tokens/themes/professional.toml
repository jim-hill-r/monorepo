# design_system/tokens/themes/professional.toml: the Professional theme.
# Primitives are this theme's palette; [light.color] and [dark.color] give
# every semantic colour token, as a #hex value, a primitive or another token.
# [accessible.*.color] overrides only what must change for WCAG AAA.

name = "professional"
label = "Professional"
description = "Neutral, dense and quiet: greys with one blue accent, a tight type scale, small radii and thin borders."

[type]
ratio = 1.125

[tokens]
leading-body = "1.45"
radius-sm = "3px"
radius-md = "6px"
radius-lg = "8px"
shadow-1 = "0 1px 1px rgb(0 0 0 / 0.08)"
shadow-2 = "0 1px 4px rgb(0 0 0 / 0.12)"
shadow-3 = "0 6px 16px rgb(0 0 0 / 0.16)"
motion-fast = "100ms"
motion-slow = "180ms"

[primitives]
white = "#ffffff"
grey-50 = "#f6f7f9"
grey-900 = "#1d1f23"
grey-600 = "#5c6370"
blue-600 = "#2557d6"
blue-300 = "#7ea6ff"
grey-950 = "#15171a"
grey-925 = "#1c1f23"
grey-100 = "#e6e8eb"

[light.color]
