# design_system/tokens/themes/colorful.toml: the Colorful theme.
# Primitives are this theme's palette; [light.color] and [dark.color] give
# every semantic colour token, as a #hex value, a primitive or another token.
# [accessible.*.color] overrides only what must change for WCAG AAA.

name = "colorful"
label = "Colorful"
description = "Playful and bright: magenta, violet, teal and sun yellow, a rounded face, pill buttons and bold borders."

[type]
ratio = 1.25

[fonts]
heading = "ui-rounded, 'SF Pro Rounded', 'Nunito', 'Varela Round', system-ui, sans-serif"
body = "ui-rounded, 'SF Pro Rounded', 'Nunito', 'Varela Round', system-ui, sans-serif"

[tokens]
weight-strong = "700"
radius-sm = "8px"
radius-md = "14px"
radius-lg = "22px"
border-width = "2px"
shadow-1 = "0 2px 0 rgb(35 25 66 / 0.12)"
shadow-2 = "0 4px 10px rgb(35 25 66 / 0.16)"
shadow-3 = "0 12px 30px rgb(35 25 66 / 0.22)"
ease = "cubic-bezier(0.34, 1.56, 0.64, 1)"

[primitives]
cream-25 = "#fffdf7"
white = "#ffffff"
grape-950 = "#231942"
grape-600 = "#5e548e"
magenta-700 = "#b5146f"
magenta-300 = "#ff6fb5"
plum-975 = "#1a1033"
plum-925 = "#251845"
lilac-25 = "#fbf5ff"

[light.color]
bg = "cream-25"
surface = "white"
surface-raised = "white"
border = "#ece3f3"
border-strong = "#9a7fb0"
text = "grape-950"
