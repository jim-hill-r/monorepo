# design_system/tokens/themes/airy.toml: the Airy theme.
# Primitives are this theme's palette; [light.color] and [dark.color] give
# every semantic colour token, as a #hex value, a primitive or another token.
# [accessible.*.color] overrides only what must change for WCAG AAA.

name = "airy"
label = "Airy"
description = "Light, calm, spacious: sky blue, mist and white, lighter type with loose lines, large radii and almost no shadow."

[type]
ratio = 1.25

[tokens]
leading-body = "1.7"
leading-heading = "1.25"
weight-strong = "500"
radius-sm = "8px"
radius-md = "14px"
radius-lg = "22px"
shadow-1 = "0 1px 2px rgb(15 40 60 / 0.05)"
shadow-2 = "0 2px 8px rgb(15 40 60 / 0.07)"
shadow-3 = "0 12px 32px rgb(15 40 60 / 0.1)"
motion-slow = "320ms"

[primitives]
white = "#ffffff"
mist-50 = "#f4f8fb"
ink-900 = "#1e2a33"
slate-600 = "#566774"
sky-700 = "#1f6fb2"
sky-300 = "#7cc4f5"
night-950 = "#0f1720"
night-900 = "#16212c"
cloud-50 = "#e8f1f7"

[light.color]
bg = "white"
surface = "mist-50"
surface-raised = "white"
border = "#dbe5ec"
border-strong = "#7a8d9c"
text = "ink-900"
