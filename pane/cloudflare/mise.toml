# pane/cloudflare: cloudflare-worker-assets project. Standard tasks: ci, fix, build, test, dev, release, deploy.
# Run with: mise run <task>
# affected-by: ../web
# deploy-on-every-push: pane's snapshot reads the whole repo, so redeploy it
# on every push to main (push-main.yml), not only pushes under pane/.

[tools]
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
node = "24"
"npm:wrangler" = "4"
"cargo:worker-build" = "0.9.0"

[env]
# Production URL. CI shows it on the GitHub deployment and in the job summary.
DEPLOY_URL = "https://jimhillr-pane.jim-hill-r.workers.dev"

[task_config]
includes = ["../../standards/tasks/cloudflare-worker-assets.toml"]

[tasks."release:assets"]
description = "Build the web app whose bundle the Worker serves"
dir = "{{config_root}}/../web"
run = "mise run release"

# Cloud sandboxes often can't install wrangler, which tests/e2e.rs needs;
# the git hooks then skip this project (git-hooks.md).
[tasks."ci:check-tools"]
description = "Fail, naming what is missing, when ci can't run here"
run = '''
command -v wrangler >/dev/null && exit 0
echo "missing wrangler, which tests/e2e.rs needs"
exit 1
'''
