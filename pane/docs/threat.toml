# pane: threat model. Format and rules: standards/docs/security.md
reviewed = "2026-11-27"
summary = "Jim's dashboard of the repo, a static Pages site built from files already public in the repo. Phase 3 adds writes and puts it behind Cloudflare Access (pane/docs/plans)."

[[surface]]
name = "site"
kind = "pages"
url = "https://jimhillr-pane.pages.dev"
access = "public"
data = "public"
previews = "public"
headers = "pane/web/public/_headers"
notes = "Everything it shows is already public in the repo, so public is right today. Before phase 3 adds the PR-opening token this must become cloudflare-access, previews included."

# Every Pages deploy (push-main.yml, nightly-cd.yml through mise-projects.yml).
[[secret]]
name = "CLOUDFLARE_API_TOKEN"
where = "github"
used_by = ["mise-projects.yml deploy step"]
scope = "jimhillr-deploy: Pages, Workers Scripts and D1 Write, Account Analytics Read, this account only"
setting = "cloudflare-api-token-scopes"

[[secret]]
name = "CLOUDFLARE_ACCOUNT_ID"
where = "github"
used_by = ["mise-projects.yml deploy step"]
scope = "An identifier, not a credential; kept as a secret so logs never show it"
setting = "github-secret-cloudflare-account-id"


[[threat]]
id = "PANE-T1"
stride = "tampering"
what = "Someone changes what the site serves."
mitigation = "Only the deploy step on main, with CLOUDFLARE_API_TOKEN, can publish; main needs a reviewed PR (github-main-ruleset)."
surface = "site"

[[threat]]
id = "PANE-T2"
stride = "elevation-of-privilege"
what = "Script injected into the page (XSS) or the site framed by another (clickjacking)."
mitigation = "Security headers from web/public/_headers (CSP with no inline script, nosniff, no-referrer, HSTS, frame-ancestors 'self'), and Dioxus escaping rendered text. The one raw-HTML spot, the deliverable view, renders repo Markdown through web/src/markdown.rs, which turns any raw HTML in it into escaped text."
surface = "site"
covers = ["raw-html"]

[[threat]]
id = "PANE-T3"
stride = "information-disclosure"
what = "Phase 3 serves private data or a write path while the site is still public."
mitigation = "The plan puts the whole site, previews included, behind Cloudflare Access before the token is added, and the Worker checks Cf-Access-Jwt-Assertion on every /api/* call; THR-003 fails if this file says private data on a public surface."
