# pane: cost analysis. Format and rules: standards/docs/cost.md
reviewed = "2026-11-27"
summary = "Dioxus review dashboard served by a Cloudflare Worker with static assets. $0 a month."
notes = "Static asset requests are free and unlimited; only /api/* runs the Worker. Phase 3 adds the cached /api/github/* routes and Phase 7 /api/free-tiers. The old Pages project jimhillr-pane is retired (pane/docs/issues/human/delete-jimhillr-pane-pages-project-after-worker.md)."

[[service]]
blip = "Cloudflare Workers"
plan = "free"
why = "The Worker `jimhillr-pane` serves the Dioxus build as Workers static assets and runs only for /api/* (run_worker_first), deployed with `wrangler deploy`."
[service.usage]
workers = 1
# One person's dashboard: a few hundred API calls a day at most.
workers_requests_per_day = 500
