# pane/web: dioxus-web project. Standard tasks: ci, fix, build, test, dev, release, deploy.
# Run with: mise run <task>

[tools]
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
cargo-binstall = "latest"
"cargo:dioxus-cli" = "0.7.3"  # must match dioxus in Cargo.lock
node = "24"  # Playwright smoke tests (package.json)

[task_config]
includes = ["../../standards/tasks/dioxus-web.toml"]

[env]
DX_PACKAGE = "pane_web"  # app inside a Cargo workspace; see standards/tasks/dioxus-web.toml

[tasks.eval-results]
description = "Copy the evals-results branch's verdicts.json and results/ into target/evals-results/"
# pane_snapshot --evals reads them for each Project page's Requirements
# section and the Requirements light (pane/snapshot/README.md). The branch is
# data, never checked out: git archive copies its two paths. Without network
# or the branch the folder stays empty, the snapshot says so and the light is
# grey, so dev and release never fail on it.
run = """
root="$(git rev-parse --show-toplevel)"
rm -rf target/evals-results && mkdir -p target/evals-results
if git -C "$root" fetch --quiet origin +evals-results:refs/remotes/origin/evals-results; then
  git -C "$root" archive refs/remotes/origin/evals-results verdicts.json results | tar -x -C target/evals-results
else
  echo 'pane: no evals-results branch; Requirements is grey'
fi
"""

[tasks.dev]
description = "Build the repo snapshot into public/data/, then serve with hot reload"
# The pages need /data/snapshot.json, so dev (and the Playwright tests, which
# start the app with `mise run dev`) builds it first, as release does, with
# the eval results when the branch can be fetched.
run = [
  "mise run eval-results || true",
  "cargo run --quiet --package pane_snapshot -- --out public/data/snapshot.json --evals target/evals-results",
  "dx serve --platform web --port 8080 --package $DX_PACKAGE",
]

[tasks.reviews]
description = "Build the review decks in docs/reviews/ to HTML and PDF into public/reviews/"
# standards/scripts/review-decks.sh writes public/reviews/<folder>/deck.html,
# deck.pdf and the deck's images, which dx copies into the bundle, so the
# site serves them under /reviews/<folder>/. Needs Node (npx, for the Marp
# CLI) and a Chrome or Chromium for the PDF (set CHROME_PATH if Marp can't
# find one). dev skips it, so the Playwright tests need neither.
run = "bash \"$(git rev-parse --show-toplevel)/standards/scripts/review-decks.sh\" \"{{config_root}}/public/reviews\""

[tasks.release]
description = "Build the repo snapshot and review decks into public/, then the release bundle into dist/"
# pane_snapshot reads the whole checkout (see pane/snapshot/README.md) and
# writes public/data/snapshot.json, which dx copies into the bundle as
# /data/snapshot.json; the reviews task adds the decks under public/reviews/.
# public/ is gitignored, so neither is ever committed (standards/docs/mise.md:
# no committed build artifacts). The Money page splits shared costs by the
# PRs merged each month, read from git, so a shallow CI checkout fetches
# its history first; without it the page says the split is unavailable.
# The repo audit runs next and its output goes to target/audit.txt for the
# Standards light. A failing audit is data for pane, not a failed release,
# so its exit code is ignored; the snapshot treats output without the
# closing `audit:` line as not run. The eval results come from the
# evals-results branch (the eval-results task), for the Requirements section.
run = [
  "if [ \"$(git rev-parse --is-shallow-repository)\" = true ]; then git fetch --quiet --unshallow origin || echo 'pane: no git history; shared costs are not split'; fi",
  "mkdir -p target && bash \"$(git rev-parse --show-toplevel)/standards/scripts/audit.sh\" > target/audit.txt 2>&1 || true",
  "mise run eval-results || true",
  "cargo run --quiet --release --package pane_snapshot -- --out public/data/snapshot.json --audit target/audit.txt --evals target/evals-results",
  "mise run reviews",
  "dx bundle --platform web --release --out-dir dist --package $DX_PACKAGE",
]
