[package]
name = "pane_web"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
dioxus = { version = "0.7.2", features = ["web", "router"] }
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
js-sys = "0.3"
pane_model = { path = "../model" }

[features]
default = ["web"]
web = [] 
