[package]
name = "pane_web"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
design_system_dioxus = { path = "../../design_system/dioxus" }
dioxus = { version = "0.7.2", features = ["web", "router"] }
gloo-net = { version = "0.8", default-features = false, features = ["http"] }
js-sys = "0.3"
pane_model = { path = "../model" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { workspace = true }
serde_json = { workspace = true }
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[features]
default = ["web"]
web = [] 
