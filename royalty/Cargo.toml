[workspace]
resolver = "2"
members = ["model", "cli"]
# Consumer and producer workspaces the scanner tests copy and scan.
exclude = ["cli/tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
toml = "1"
