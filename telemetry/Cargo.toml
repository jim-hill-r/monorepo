[package]
name = "telemetry"
description = "The telemetry Worker: one POST /event route that checks events and writes them to Analytics Engine"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: the repo has no root Rust workspace (standards/docs/mise.md).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The Worker glue only builds for wasm, so `cargo test` checks the event
# logic natively without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.9.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
