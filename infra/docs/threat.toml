[[secret]]
name = "AUTH0_INFRA_CREDENTIALS_CLIENT_ID"
where = "github"
used_by = ["infra-apply.yml credentials job", "infra-mint.yml"]
scope = "Bootstrap Auth0 app that manages clients and grants; infra-credentials only"
setting = "rotate-auth0-infra-credentials"

[[secret]]
name = "AUTH0_INFRA_CREDENTIALS_CLIENT_SECRET"
where = "github"
used_by = ["infra-apply.yml credentials job", "infra-mint.yml"]
scope = "Bootstrap Auth0 app that manages clients and grants; infra-credentials only"
setting = "rotate-auth0-infra-credentials"

[[secret]]
name = "CLOUDFLARE_INFRA_READ_TOKEN"
where = "github"
used_by = ["infra-plan.yml", "infra-drift.yml", "infra-apply.yml"]
scope = "jimhillr-infra-read: Account Settings Read only"
setting = "cloudflare-infra-token-scopes"

[[secret]]
name = "CLOUDFLARE_INFRA_APPLY_TOKEN"
where = "github"
used_by = ["infra-apply.yml"]
scope = "jimhillr-infra-apply: Account Settings Write only; infra environment only"
setting = "cloudflare-infra-token-scopes"

[[secret]]
name = "CLOUDFLARE_INFRA_CREDENTIALS_TOKEN"
where = "github"
used_by = ["infra-apply.yml credentials job", "infra-mint.yml"]
scope = "Bootstrap token: Account API Tokens Write only; infra-credentials only"
setting = "cloudflare-infra-credentials-token"

[[secret]]
name = "CLOUDFLARE_ACCOUNT_ID"
where = "github"
used_by = ["infra-plan.yml", "infra-drift.yml", "infra-apply.yml", "infra-mint.yml"]
scope = "An identifier, not a credential; kept as a secret so logs never show it"
setting = "github-secret-cloudflare-account-id"

[[secret]]
name = "CLOUDFLARE_API_TOKEN"
where = "github"
used_by = ["infra-mint.yml"]
scope = "jimhillr-deploy, which Infra Mint rotates: Pages, Workers Scripts and D1 Write"
setting = "cloudflare-api-token-scopes"

[[secret]]
name = "GH_INFRA_CREDENTIALS_APP_KEY"
where = "github"
used_by = ["infra-mint.yml"]
scope = "Private key of the infra GitHub App: Secrets, Environments, Variables and Administration on this repo; infra-credentials only"
setting = "github-app-infra"

[[threat]]
id = "INFRA-T1"
stride = "elevation-of-privilege"
what = "A pull request uses the plan's credentials to change settings."
mitigation = "infra-plan gets only read-only credentials (read:clients, Account Settings Read, the state read password), and only for PRs from this repo, never forks. Every write credential is in the infra or infra-credentials environment, which run only on main."

[[threat]]
id = "INFRA-T2"
stride = "elevation-of-privilege"
what = "A credential change applies without Jim seeing it."
mitigation = "Credential changes run in the infra-credentials environment, which needs Jim's approval for each run on top of the PR approval (decision 0010)."

[[threat]]
id = "INFRA-T3"
stride = "information-disclosure"
what = "A secret ends up in git or OpenTofu state."
mitigation = "OpenTofu never makes or copies a secret: Infra Mint pipes each one straight into a GitHub secret (decision 0011), and the IAC-002 plan guard fails any plan with a sensitive value in state."
