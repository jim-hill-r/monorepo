# infra: threat model. Format and rules: standards/docs/security.md
reviewed = "2026-11-27"
summary = "Infrastructure as code (decision 0007): a Rust synth of OpenTofu JSON, planned on PRs, applied on main, and Infra Mint, which makes every other infra secret straight into GitHub (decision 0011). Changes Auth0, Cloudflare and GitHub settings; holds no secret values in git or state."

[[surface]]
name = "infra workflows"
kind = "cli"
access = "none"
data = "private"
notes = "Nothing is served. The risk is what the workflows can change: infra-plan (PRs, read-only), infra-apply (main, infra and infra-credentials environments), infra-drift (weekly, read-only) and infra-mint (infra-credentials, Jim approves each run)."

[[secret]]
name = "TOFU_STATE_READ_PASSWORD"
where = "github"
used_by = ["infra-plan.yml", "infra-drift.yml"]
scope = "Reads state only"
setting = "github-secrets-tofu-state"

[[secret]]
name = "TOFU_STATE_WRITE_PASSWORD"
where = "github"
used_by = ["infra-apply.yml"]
scope = "Reads, writes and locks state; infra environment only"
setting = "github-secrets-tofu-state"

[[secret]]
name = "TOFU_STATE_PASSPHRASE"
where = "github"
used_by = ["infra-plan.yml", "infra-drift.yml", "infra-apply.yml"]
scope = "Encrypts and decrypts state"
setting = "github-secrets-tofu-state"

[[secret]]
name = "AUTH0_INFRA_READ_DOMAIN"
where = "github"
used_by = ["infra-plan.yml", "infra-drift.yml", "infra-apply.yml"]
scope = "infra-read Auth0 app: read:clients only"
setting = "auth0-infra-apps"

[[secret]]
name = "AUTH0_INFRA_READ_CLIENT_ID"
where = "github"
used_by = ["infra-plan.yml", "infra-drift.yml", "infra-apply.yml"]
scope = "infra-read Auth0 app: read:clients only"
setting = "auth0-infra-apps"

[[secret]]
name = "AUTH0_INFRA_READ_CLIENT_SECRET"
where = "github"
used_by = ["infra-plan.yml", "infra-drift.yml", "infra-apply.yml"]
scope = "infra-read Auth0 app: read:clients only"
setting = "auth0-infra-apps"

[[secret]]
name = "AUTH0_INFRA_APPLY_DOMAIN"
where = "github"
used_by = ["infra-apply.yml"]
scope = "infra-apply Auth0 app: read:clients and update:clients; infra environment only"
setting = "auth0-infra-apps"

[[secret]]
name = "AUTH0_INFRA_APPLY_CLIENT_ID"
where = "github"
used_by = ["infra-apply.yml"]
scope = "infra-apply Auth0 app: read:clients and update:clients; infra environment only"
setting = "auth0-infra-apps"

[[secret]]
name = "AUTH0_INFRA_APPLY_CLIENT_SECRET"
where = "github"
used_by = ["infra-apply.yml"]
scope = "infra-apply Auth0 app: read:clients and update:clients; infra environment only"
setting = "auth0-infra-apps"

[[secret]]
