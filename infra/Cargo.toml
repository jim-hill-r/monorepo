[package]
name = "infra"
version = "0.1.0"
edition = "2024"
description = "Infrastructure as code: Rust constructs that synthesize Terraform JSON for OpenTofu (decision 0007)"
publish = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "infra"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Typed bindings for Terraform providers (decision 0007, A1). The bindings in
# src/tfschema/ are generated by terrars-generate from the same version, see
# README.md. Bugs are fixed upstream; until a fix is released, pin a git
# dependency on the fixed commit here and say which PR it waits for.
terrars = { version = "=0.4.0", features = ["opentofu"] }

[dev-dependencies]
tempfile = "3"
