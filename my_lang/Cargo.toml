[package]
name = "my_lang"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dependencies]
# LLVM bindings for code generation
# Using LLVM 18 which is widely available on Ubuntu 22.04+ and macOS
inkwell = { version = "0.11.0", features = ["llvm18-1"] }

# Argument parsing for the `my_lang` command-line binary (src/main.rs)
clap = { version = "4", features = ["derive"] }

[lints.rust]
# The standard is "forbid" (LIN-002). my_lang uses "deny" so that the one
# unsafe block that calls JIT-compiled code, in src/jit.rs, can opt out with
# #[allow(unsafe_code)] and a SAFETY comment. No other code may use unsafe.
unsafe_code = "deny"

[dev-dependencies]
# CLI transcript tests in tests/cmd/ (tests/cli_transcripts.rs), the
# trycmd evals in evals.toml
trycmd = "1.2.1"
