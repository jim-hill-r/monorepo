# my_lang: rust project. Standard tasks: ci, fix, build, test, dev, release, deploy.
# Run with: mise run <task>

[tools]
rust = { version = "stable", components = "rustfmt,clippy" }

[task_config]
includes = ["../standards/tasks/rust.toml"]

# inkwell (llvm18-1) links against LLVM 18.
[env]
LLVM_SYS_181_PREFIX = "/usr/lib/llvm-18"

[tasks."ci:deps"]
description = "Install LLVM 18 on Linux CI"
run = '''
if [ -n "${CI:-}" ] && command -v apt-get >/dev/null; then
  sudo apt-get update
  sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev
fi
'''

# The git hooks skip this project when LLVM 18's headers are missing; see
# standards/docs/git-hooks.md.
[tasks."ci:check-tools"]
description = "Fail, naming what is missing, when ci can't build here"
run = '''
[ -f "$LLVM_SYS_181_PREFIX/include/llvm-c/Core.h" ] && exit 0
echo "LLVM 18 headers not found in $LLVM_SYS_181_PREFIX (apt: llvm-18-dev libpolly-18-dev libzstd-dev)"
exit 1
'''
