# How each requirement in docs/requirements.md is checked.
# Format: standards/docs/evals.md.
#
# my_lang is a library with no CLI, release or deploy yet, so every eval
# is a `cargo` eval in the `ci` stage, naming existing tests with `filter`.
# The `must` requirements get production-stage (`cd`) trycmd evals against
# the release binary once the CLI exists
# (docs/issues/production-evals-with-the-cli.md); until then `evals check`
# warns EVL-004 for them.

prefix = "LANG"

# LANG-001: A program runs and gives the right answer

[[eval]]
id = "jit-runs-programs"
requirement = "LANG-001"
stages = ["ci"]
kind = "cargo"
filter = "test_jit_"
description = "Arithmetic, comparisons, variables, calls and up to 4 arguments run through the JIT, plus its argument errors."

[[eval]]
id = "jit-end-to-end"
requirement = "LANG-001"
stages = ["ci"]
kind = "cargo"
filter = "test_jit_e2e_"
description = "Source text to result through the public API (tests/integration_tests.rs)."

[[eval]]
id = "jit-trailing-expression"
requirement = "LANG-001"
stages = ["ci"]
kind = "cargo"
filter = "test_jit_trailing_"
description = "A body that ends in an expression without `return` gives that expression's value (the README examples)."

[[eval]]
id = "codegen-arithmetic"
requirement = "LANG-001"
stages = ["ci"]
kind = "cargo"
filter = "test_addition"

[[eval]]
id = "codegen-variables"
requirement = "LANG-001"
stages = ["ci"]
kind = "cargo"
filter = "test_variable_assignment_and_use"

[[eval]]
id = "codegen-calls"
requirement = "LANG-001"
stages = ["ci"]
kind = "cargo"
filter = "test_function_call"

