# Shared mise tasks for Dioxus web apps.
#
# Needs in the project's [tools]: rust (with the wasm32-unknown-unknown target)
# and "cargo:dioxus-cli" pinned to the project's dioxus version. Projects with a
# package.json (Playwright end-to-end tests) also need node.
#
# An app inside a Cargo workspace sets DX_PACKAGE in its [env]: dx resolves
# the workspace's default-members against the current directory and fails
# unless --package is given.

[fmt-check]
run = "cargo fmt --all --check"

[lint]
run = "cargo clippy -- -D warnings"

[build]
run = "cargo build"

[test]
description = "Rust tests, then the Playwright tests (e2e)"
run = [
  "cargo test",
  "mise run e2e",
]

[e2e]
description = "Playwright tests when the project has a package.json"
# In CI (CI is set) every step must pass. Anywhere else, such as an agent's
# cloud sandbox, a tool that can't be installed there (npm packages, dx or
# Playwright's browsers) skips the tests with a note instead of failing, since
# PR CI runs them. When Playwright can't download its browser there, the tests
# run in the machine's own Chromium if it has one. Tested by
# standards/tests/e2e-task.test.sh; see standards/docs/git-hooks.md.
run = """
[ -f package.json ] || exit 0
skip() {
  echo "e2e: $1" >&2
  if [ -n "${CI:-}" ]; then exit 1; fi
  echo "e2e: Playwright tests not checked here; PR CI runs them" >&2
  exit 0
}
npm ci || skip "couldn't install the npm packages"
command -v dx >/dev/null 2>&1 || skip "dx (dioxus-cli) is not installed"
if ! npx playwright install --with-deps; then
  # Outside CI, fall back to a Chromium the machine already has: the one in
  # PLAYWRIGHT_CHROMIUM_PATH, else a Claude Code cloud sandbox's own, for an
  # app whose playwright.config.ts launches PLAYWRIGHT_CHROMIUM_PATH.
  [ -n "${CI:-}" ] || export PLAYWRIGHT_CHROMIUM_PATH="${PLAYWRIGHT_CHROMIUM_PATH:-/opt/pw-browsers/chromium}"
  [ -z "${CI:-}" ] && [ -x "$PLAYWRIGHT_CHROMIUM_PATH" ] \
    && grep -qs PLAYWRIGHT_CHROMIUM_PATH playwright.config.* \
    || skip "couldn't install Playwright's browsers"
  echo "e2e: using the Chromium at $PLAYWRIGHT_CHROMIUM_PATH" >&2
  # Such a machine also can't reach outside services, so tests tagged
  # @network (like Auth0 sign-in) are left to PR CI.
  echo "e2e: skipping @network tests; PR CI runs them" >&2
  set -- --grep-invert @network
fi
# Also save the JSON report for the evals task (standards/docs/evals.md).
mkdir -p target/evals-reports
rm -f target/evals-reports/playwright.json
PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/target/evals-reports/playwright.json" npm test -- --reporter=list,json "$@"
"""

["ci:deps"]
description = "System packages CI needs; override in a project's mise.toml"
run = "true"

[ci]
description = "Everything CI checks; makes no artifacts (test reports go in target/evals-reports)"
depends = ["ci:deps"]
run = [
  "cargo fmt --all --check",
  "cargo clippy -- -D warnings",
  "cargo build",
  "bash \"$(git rev-parse --show-toplevel)/standards/scripts/evals.sh\" report cargo-test cargo test",
  "mise run e2e",
]

[fix]
run = [
  "cargo fmt --all",
  "cargo clippy --all-targets --fix --allow-dirty --allow-staged",
]

[dev]
description = "Serve with hot reload"
run = "dx serve --platform web --port 8080 ${DX_PACKAGE:+--package $DX_PACKAGE}"

[release]
description = "Release bundle into dist/"
run = "dx bundle --platform web --release --out-dir dist ${DX_PACKAGE:+--package $DX_PACKAGE}"

[deploy]
description = "Web apps deploy through their cloudflare/ project"
run = "echo 'deploy: this app is deployed by its cloudflare project, if it has one'"

[evals]
description = "Turn the reports ci saved into eval results (standards/docs/evals.md)"
run = "bash \"$(git rev-parse --show-toplevel)/standards/scripts/evals.sh\" run"
