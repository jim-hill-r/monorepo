# Shared mise tasks for Dioxus web apps.
#
# Needs in the project's [tools]: rust (with the wasm32-unknown-unknown target)
# and "cargo:dioxus-cli" pinned to the project's dioxus version. Projects with a
# package.json (Playwright end-to-end tests) also need node.
#
# An app inside a Cargo workspace sets DX_PACKAGE in its [env]: dx resolves
# the workspace's default-members against the current directory and fails
# unless --package is given.

[fmt-check]
run = "cargo fmt --all --check"

[lint]
run = "cargo clippy -- -D warnings"

[build]
run = "cargo build"

[test]
description = "Rust tests, then the Playwright tests (e2e)"
run = [
  "cargo test",
  "mise run e2e",
]

[e2e]
description = "Playwright tests when the project has a package.json"
# In CI (CI is set) every step must pass. Anywhere else, such as an agent's
# cloud sandbox, a tool that can't be installed there (npm packages, dx or
# Playwright's browsers) skips the tests with a note instead of failing, since
# PR CI runs them. Tested by
# standards/tests/e2e-task.test.sh; see standards/docs/git-hooks.md.
run = """
[ -f package.json ] || exit 0
skip() {
  echo "e2e: $1" >&2
  if [ -n "${CI:-}" ]; then exit 1; fi
  echo "e2e: Playwright tests not checked here; PR CI runs them" >&2
  exit 0
}
npm ci || skip "couldn't install the npm packages"
command -v dx >/dev/null 2>&1 || skip "dx (dioxus-cli) is not installed"
npx playwright install --with-deps || skip "couldn't install Playwright's browsers"
npm test
"""

["ci:deps"]
description = "System packages CI needs; override in a project's mise.toml"
run = "true"

[ci]
description = "Everything CI checks; makes no artifacts"
depends = ["ci:deps"]
run = [
  "cargo fmt --all --check",
  "cargo clippy -- -D warnings",
  "cargo build",
  "cargo test",
  "mise run e2e",
]

[fix]
run = [
  "cargo fmt --all",
  "cargo clippy --all-targets --fix --allow-dirty --allow-staged",
]

[dev]
description = "Serve with hot reload"
run = "dx serve --platform web --port 8080 ${DX_PACKAGE:+--package $DX_PACKAGE}"

[release]
description = "Release bundle into dist/"
run = "dx bundle --platform web --release --out-dir dist ${DX_PACKAGE:+--package $DX_PACKAGE}"

[deploy]
description = "Web apps deploy through their cloudflare/ project"
run = "echo 'deploy: this app is deployed by its cloudflare project, if it has one'"
