# Shared mise tasks for Bevy games.
#
# On Linux CI the system libraries Bevy links against are installed first,
# and tests run under xvfb so window-creating tests have a display.
#
# Builds for players (standards/scripts/bevy-release.sh, and "Game builds"
# in standards/docs/mise.md):
#   release:web      dist/web, a WebAssembly build. Needs in [tools] the
#                    wasm32-unknown-unknown rust target and
#                    "cargo:wasm-bindgen-cli" matching Cargo.lock.
#   release:macos    dist/<name>-macos.zip (on macOS only).
#   release:android  dist/<name>-android.apk. Needs the aarch64-linux-android
#                    rust target and "cargo:cargo-apk".
# A game with a wrangler.toml deploys its web build to Cloudflare Pages (set
# DEPLOY_URL in [env], and add node and "npm:wrangler" to [tools]). A game
# with RELEASE_TAG in [env] gets its macOS and Android builds published to
# that GitHub Release every night by nightly-downloads.yml.

["ci:deps"]
description = "Install Bevy's Linux system libraries on CI"
run = '''
if [ -n "${CI:-}" ] && command -v apt-get >/dev/null; then
  sudo apt-get update
  sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev xvfb
fi
'''

["ci:check-tools"]
description = "Fail, naming what is missing, when ci can't build here"
# The git hooks skip the project when this fails (standards/docs/git-hooks.md);
# in CI, ci:deps installs the libraries instead.
run = '''
missing=""
for lib in alsa libudev; do
  pkg-config --exists "$lib" 2>/dev/null || missing="$missing $lib"
done
[ -z "$missing" ] && exit 0
echo "system libraries missing:$missing (apt: libasound2-dev libudev-dev)"
exit 1
'''

[fmt-check]
run = "cargo fmt --all --check"

[lint]
run = "cargo clippy -- -D warnings"

[build]
run = "cargo build"

[test]
run = "if command -v xvfb-run >/dev/null; then xvfb-run -a cargo test; else cargo test; fi"

[ci]
description = "Everything CI checks; makes no artifacts (test reports go in target/evals-reports)"
depends = ["ci:deps"]
run = [
  "cargo fmt --all --check",
  "cargo clippy -- -D warnings",
  "cargo build",
  "bash \"$(git rev-parse --show-toplevel)/standards/scripts/evals.sh\" report cargo-test sh -c 'if command -v xvfb-run >/dev/null; then xvfb-run -a cargo test; else cargo test; fi'",
]

[fix]
run = [
  "cargo fmt --all",
  "cargo clippy --all-targets --fix --allow-dirty --allow-staged",
]

[dev]
run = "cargo run"

[release]
run = "cargo build --release"

["release:web"]
description = "WebAssembly build for the browser, in dist/web"
run = "bash \"$(git rev-parse --show-toplevel)/standards/scripts/bevy-release.sh\" web"

["release:macos"]
description = "Universal macOS app, zipped, in dist/ (macOS only)"
run = "bash \"$(git rev-parse --show-toplevel)/standards/scripts/bevy-release.sh\" macos"

["release:android"]
description = "Android APK in dist/"
run = "bash \"$(git rev-parse --show-toplevel)/standards/scripts/bevy-release.sh\" android"

[deploy]
description = "Publish the web build to Cloudflare Pages when the game has a wrangler.toml"
run = '''
if [ ! -f wrangler.toml ]; then
  echo "deploy: no wrangler.toml, so this game has no web build to deploy"
  exit 0
fi
mise run release:web
bash "$(git rev-parse --show-toplevel)/standards/scripts/free-tiers.sh" pages-project
wrangler pages deploy
'''

[evals]
description = "Turn the reports ci saved into eval results (standards/docs/evals.md)"
run = "bash \"$(git rev-parse --show-toplevel)/standards/scripts/evals.sh\" run"
