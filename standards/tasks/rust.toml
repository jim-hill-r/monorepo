# Shared mise tasks for Rust crates and Rust workspaces.
#
# Include from a project's mise.toml:
#   [task_config]
#   includes = ["<relative path>/standards/tasks/rust.toml"]
#
# Every project type answers the same task names:
#   ci, fix, build, test, dev, release, deploy
# See standards/docs/build-and-ci.md.

[fmt-check]
description = "Check formatting"
run = "cargo fmt --all --check"

[lint]
description = "Clippy with warnings as errors"
run = "cargo clippy -- -D warnings"

[build]
description = "Debug build"
run = "cargo build"

[test]
description = "Run tests"
run = "cargo test"

["ci:deps"]
description = "System packages CI needs; override in a project's mise.toml"
run = "true"

[ci]
description = "Everything CI checks; makes no artifacts (test reports go in target/evals-reports)"
depends = ["ci:deps"]
run = [
  "cargo fmt --all --check",
  "cargo clippy -- -D warnings",
  "cargo build",
  "bash \"$(git rev-parse --show-toplevel)/standards/scripts/evals.sh\" report cargo-test cargo test",
]

[fix]
description = "Format and apply safe clippy fixes"
run = [
  "cargo fmt --all",
  "cargo clippy --all-targets --fix --allow-dirty --allow-staged",
]

[dev]
description = "Run the default binary"
run = "cargo run"

[release]
description = "Release build"
run = "cargo build --release"

[deploy]
description = "Nothing to deploy for a plain Rust crate"
run = "echo 'deploy: nothing to deploy for this project'"

[evals]
description = "Turn the reports ci saved into eval results (standards/docs/evals.md)"
run = "bash \"$(git rev-parse --show-toplevel)/standards/scripts/evals.sh\" run"
