# Files a detector must not count.

[[exempt]]
path = "standards/radar/"
detector = "*"
why = "The radar, limits and detectors name every vendor by design."

[[exempt]]
path = "standards/settings.toml"
detector = "*"
why = "The list of settings made by hand names each vendor's dashboard by design; it uses no service itself."

[[exempt]]
path = "standards/scripts/billing-check.sh"
detector = "*"
why = "The billing check reads each radar vendor's billing by design (free, read-only); the vendors are the radar's, not standards'."

[[exempt]]
path = "cost/"
detector = "*"
why = "The cost check's own tests use detector fixtures."

[[exempt]]
path = "bear_down/web/tests/"
detector = "cors-any-origin"
why = "Playwright tests stub the telemetry Worker's CORS reply; telemetry's threat model covers the real one."

[[exempt]]
path = "threat/"
detector = "*"
why = "The threat check's own tests use detector fixtures."

[[exempt]]
path = "pane/web/src/markdown.rs"
detector = "unknown-host"
why = "Test links for the Markdown renderer."

[[exempt]]
path = "infra/src/tfschema/"
detector = "unknown-host"
why = "Generated provider bindings; the hosts are examples in the provider's attribute docs, not services."

[[exempt]]
path = "profiles/content_provider/src/lib.rs"
detector = "unknown-host"
why = "Links on the profile page, not services."


[[exempt]]
path = "standards/scripts/free-tiers.sh"
detector = "rapidapi"
why = "FT-002 searches the workflows for a RapidAPI key."

[[exempt]]
path = "jimhillr/workflow_tests/"
detector = "rapidapi"
why = "Tests for the FT-002 guard."

[[exempt]]
path = "jimhillr/workflow_tests/"
detector = "auth0"
why = "Tests that assert which Auth0 secret names the infra workflows use; infra's docs/cost.toml counts the Auth0 use."
