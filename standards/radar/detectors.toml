# Files a detector must not count.

[[exempt]]
path = "standards/radar/"
detector = "*"
why = "The radar, limits and detectors name every vendor by design."

[[exempt]]
path = "cost/"
detector = "*"
why = "The cost check's own tests use detector fixtures."

[[exempt]]
path = "pane/web/src/markdown.rs"
detector = "unknown-host"
why = "Test links for the Markdown renderer."

[[exempt]]
path = "infra/src/tfschema/"
detector = "unknown-host"
why = "Generated provider bindings; the hosts are examples in the provider's attribute docs, not services."

[[exempt]]
path = "profiles/content_provider/src/lib.rs"
detector = "unknown-host"
why = "Links on the profile page, not services."


[[exempt]]
path = "standards/scripts/free-tiers.sh"
detector = "rapidapi"
why = "FT-002 searches the workflows for a RapidAPI key."

[[exempt]]
path = "monorepo/workflow_tests/"
detector = "rapidapi"
why = "Tests for the FT-002 guard."
