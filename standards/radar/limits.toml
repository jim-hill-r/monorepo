# Free limits of every service the repo uses, and our budgets inside them.
#
# The one source for these numbers: `standards/scripts/free-tiers.sh` reads
# its budgets from here, `cost check` holds every project's docs/cost.toml
# to them (COST-005), and the tables in standards/docs/free-tiers.md are
# generated from this file (`cost render`; standards CI fails when they
# differ). The convention is in standards/docs/cost.md.
#
# Fields:
#   key        Usage key, used in [service.usage] in docs/cost.toml.
#   blip       The vendor blip in standards/radar/radar.json it belongs to.
#   item       What the limit counts, as the table shows it.
#   free       The vendor's free limit, a whole number of `unit`. Leave it
#              out when the limit isn't a number (say why in free_note).
#   budget     Ours, well inside `free`. Leave it out to hold usage to the
#              free limit itself. Only Jim sets or raises a budget.
#   scope      "account": summed over every project. "project": each
#              project on its own.
#   unit       What the numbers count. "bytes" is shown in GB or MB.
#   past       What happens past the free limit.
#   source     The vendor page the number came from.
#   checked    When someone last checked the number against the source.
#   free_note, budget_note   Optional text shown after the number.
#
# The guards in free-tiers.sh read `free` and `budget` with a line-based
# parser: keep every field on its own line as `name = value`.

# ---------------------------------------------------------------- GitHub ----

[[limit]]
key = "github_runner_minutes_per_month"
blip = "GitHub (Actions, Dependabot, CodeQL)"
item = "Minutes on standard GitHub-hosted runners"
free_note = "Unlimited on a public repo ($12 a month of compute, about 2,000 Linux minutes, if it goes private)"
scope = "account"
unit = "minutes"
past = "Blocked with no payment method if the repo goes private"
source = "https://docs.github.com/en/billing/concepts/product-billing/github-actions"
checked = "2026-11-26"

