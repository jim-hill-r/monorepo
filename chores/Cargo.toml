[package]
name = "chores"
description = "Deterministic commands for routine agent work: pick the next issue, write PR descriptions, scaffold issue files."
version = "0.1.0"
edition = "2024"
publish = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
