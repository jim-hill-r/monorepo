# Repo root. Installs no tools and builds nothing: every project directory has
# its own mise.toml with its tools and the standard tasks for its type
# (standards/tasks/*.toml). Run a task in one project with
#   cd <project> && mise run ci
# or, from anywhere, across every project:
#   mise run '//...:ci'

monorepo_root = true

[settings]
experimental = true

# Every directory with its own mise.toml is a project. //:audit checks this
# list matches.
[monorepo]
config_roots = [
  "athenaeum",
  "athenaeum/learning/computer_science/algorithms/neet_code_150",
  "auth_sdk",
  "bear_down",
  "bear_down/cloudflare",
  "bear_down/web",
  "blueeel",
  "bogan",
  "cahokia",
  "cahokia/cloudflare",
  "cahokia/web",
  "chores",
  "controlled_chaos",
  "cookbook",
  "cookbook/cloudflare",
  "cookbook/web",
  "cost",
  "design_system",
  "design_system/preview",
  "evals",
  "homer",
  "infra",
  "jimhillr",
  "luggage",
  "my_lang",
  "observability",
  "pane",
  "pane/cloudflare",
  "pane/model",
  "pane/snapshot",
  "pane/web",
  "profiles",
  "profiles/content_provider",
  "profiles/jimhillr",
  "psy_ents",
  "royalty",
  "sparkhill",
  "sparkhill/cloudflare",
  "sparkhill/webapp",
  "sparkhill/webapp_cloudflare",
  "sparkhill/website",
  "standards",
  "starcraft",
  "telemetry",
  "threat",
  "tofu_state",
]

[tasks."affected"]
description = "List project directories touched by changes since a base ref (JSON array)"
dir = "{{config_root}}"
run = "bash standards/scripts/affected.sh"

[tasks."projects"]
description = "List every project directory (JSON array)"
dir = "{{config_root}}"
run = "bash standards/scripts/affected.sh --all"

[tasks."audit"]
description = "Check every project follows the repo standards"
dir = "{{config_root}}"
run = "bash standards/scripts/audit.sh"

[tasks."issues"]
description = "List the open issues from the issue files (--human for human tasks, --check to validate)"
dir = "{{config_root}}"
run = "bash standards/scripts/issues.sh"

[tasks."review-decks"]
description = "Build the review decks in docs/reviews to HTML and PDF"
dir = "{{config_root}}"
run = "bash standards/scripts/review-decks.sh"

[tasks."hooks"]
description = "Install lefthook (through mise) and the git hooks that run the CI checks"
dir = "{{config_root}}"
run = "bash standards/scripts/setup-hooks.sh"

[tasks."downloads"]
description = "List the projects that publish nightly downloads to a GitHub Release (JSON array)"
dir = "{{config_root}}"
run = "bash standards/scripts/downloads.sh list"

[tasks."pr-summary"]
description = "Warn when a PR description (PR_BODY or stdin) lacks a section, has an unknown attention tag or a summary over its word limit (PR-001)"
dir = "{{config_root}}"
run = "bash standards/scripts/pr-summary-check.sh"
