# CHAOS-008: Desktop and Android builds can be downloaded

[[eval]]
id = "nightly-macos-download"
requirement = "CHAOS-008"
stages = ["cd"]
kind = "http"
url = "https://github.com/jimhillr/monorepo/releases/download/controlled_chaos-nightly/controlled_chaos-macos.zip"
method = "HEAD"
status = 302
description = "The nightly release has the macOS zip (GitHub redirects to the file; a missing asset is a 404)."

[[eval]]
id = "nightly-android-download"
requirement = "CHAOS-008"
stages = ["cd"]
kind = "http"
url = "https://github.com/jimhillr/monorepo/releases/download/controlled_chaos-nightly/controlled_chaos-android.apk"
method = "HEAD"
status = 302
description = "The nightly release has the Android APK (GitHub redirects to the file; a missing asset is a 404)."

# CHAOS-009: The web build is safe to open

[[eval]]
id = "live-csp-forbids-framing"
requirement = "CHAOS-009"
stages = ["cd"]
kind = "http"
path = "/"
header = "content-security-policy: frame-ancestors 'none'"

[[eval]]
id = "live-csp-own-scripts-only"
requirement = "CHAOS-009"
stages = ["cd"]
kind = "http"
path = "/"
header = "content-security-policy: script-src 'self' 'wasm-unsafe-eval'"

[[eval]]
id = "live-nosniff"
requirement = "CHAOS-009"
stages = ["cd"]
kind = "http"
path = "/"
header = "x-content-type-options: nosniff"

[[eval]]
id = "live-hsts"
requirement = "CHAOS-009"
stages = ["cd"]
kind = "http"
path = "/"
header = "strict-transport-security: max-age="
