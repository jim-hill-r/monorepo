# How each requirement in docs/requirements.md is checked.
# Format: standards/docs/evals.md.

prefix = "CHAOS"

# CHAOS-001: Anyone can play a game in a browser with nothing to install

[[eval]]
id = "smoke-script-plays-a-round"
requirement = "CHAOS-001"
stages = ["ci"]
kind = "cargo"
filter = "the_smoke_script_passes"
description = "smoke/smoke.script plays a round against the CPU from the start screen, headless."

[[eval]]
id = "start-screen-has-start-game"
requirement = "CHAOS-001"
stages = ["ci"]
kind = "cargo"
filter = "spawn_splash_creates_start_button"

[[eval]]
id = "game-is-against-the-cpu"
requirement = "CHAOS-001"
stages = ["ci"]
kind = "cargo"
filter = "setup_names_player_two_cpu"

[[eval]]
id = "live-page"
requirement = "CHAOS-001"
stages = ["cd"]
kind = "http"
path = "/"
body_contains = "<title>Controlled Chaos</title>"
max_ms = 3000

[[eval]]
id = "live-start-up-script"
requirement = "CHAOS-001"
stages = ["cd"]
kind = "http"
path = "/boot.js"
body_contains = "The game failed to start"
description = "The start-up script that loads the game and shows an error instead of a blank page."

[[eval]]
id = "live-game-wasm"
requirement = "CHAOS-001"
stages = ["cd"]
kind = "http"
path = "/game_bg.wasm"
method = "HEAD"
header = "content-type: application/wasm"

[[eval]]
id = "no-panics-in-production"
requirement = "CHAOS-001"
stages = ["observe"]
kind = "metric"
source = "analytics-engine"
metric = "controlled_chaos_error_events"
max = 0
window = "7d"
description = "No `error` (panic) event from the web build in the past week."

