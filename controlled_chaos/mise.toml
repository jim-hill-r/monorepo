# controlled_chaos: bevy-game project. Standard tasks: ci, fix, build, test, dev, release, deploy.
# Run with: mise run <task>
# Builds for playtesting: mise run release:web | release:macos | release:android
# (see "Playtesting" in README.md).

[tools]
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown,aarch64-linux-android,aarch64-apple-darwin,x86_64-apple-darwin" }
cargo-binstall = "latest"
"cargo:wasm-bindgen-cli" = "0.2.108"  # must match wasm-bindgen in Cargo.lock
"cargo:cargo-apk" = "0.10.0"
node = "24"
"npm:wrangler" = "4"

[env]
GAME_TITLE = "Controlled Chaos"
# Web build for playtesting. CI shows it on the GitHub deployment and in the job summary.
DEPLOY_URL = "https://jimhillr-controlled-chaos.pages.dev"
# GitHub Release that nightly-downloads.yml publishes the macOS and Android builds to.
RELEASE_TAG = "controlled_chaos-nightly"

[task_config]
includes = ["../standards/tasks/bevy-game.toml"]

[tasks.smoke]
description = "Play smoke/smoke.script under xvfb: screenshots and a video in target/smoke"
run = "bash smoke/run.sh"
