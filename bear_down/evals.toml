# How each requirement in docs/requirements.md is checked.
# Format: standards/docs/evals.md.

prefix = "BEAR"

# BEAR-001: Every game this week gets a verdict

[[eval]]
id = "every-game-has-a-verdict"
requirement = "BEAR-001"
stages = ["ci"]
kind = "cargo"
filter = "every_game_is_explained_from_what_was_measured"

[[eval]]
id = "live-guide-has-verdicts"
requirement = "BEAR-001"
stages = ["cd"]
kind = "http"
path = "/rooting.json"
body_contains = "\"root_for\""

# BEAR-002: A pick says how much it helps

[[eval]]
id = "games-ranked-by-swing"
requirement = "BEAR-002"
stages = ["ci"]
kind = "cargo"
filter = "ranks_by_absolute_swing_for_the_goal"

[[eval]]
id = "live-guide-has-swings"
requirement = "BEAR-002"
stages = ["cd"]
kind = "http"
path = "/rooting.json"
body_contains = "\"swing\""

# BEAR-003: Every game explains how it reaches the Bears

[[eval]]
id = "every-game-is-explained"
requirement = "BEAR-003"
stages = ["ci"]
kind = "cargo"
filter = "every_game_is_explained_from_what_was_measured"

[[eval]]
id = "golden-week-2020-wild-card"
requirement = "BEAR-003"
stages = ["ci"]
kind = "cargo"
filter = "golden_week_2020_week_17"
description = "Cardinals at Rams reaches the 8-7 Bears through the wild card, as it did."

[[eval]]
id = "live-guide-has-channels"
requirement = "BEAR-003"
stages = ["cd"]
kind = "http"
path = "/rooting.json"
body_contains = "\"channels\""

# BEAR-004: Conflicting effects are named and netted

[[eval]]
id = "channel-shares-add-up"
requirement = "BEAR-004"
stages = ["ci"]
kind = "cargo"
filter = "channel_shares_add_up_to_the_swing"

[[eval]]
id = "live-guide-has-explanations"
requirement = "BEAR-004"
stages = ["cd"]
kind = "http"
path = "/rooting.json"
body_contains = "\"why\""

# BEAR-005: "Doesn't matter" is earned and explained

[[eval]]
id = "tiers-follow-the-line"
requirement = "BEAR-005"
stages = ["ci"]
kind = "cargo"
filter = "tiers_follow_the_line_with_confidence"

[[eval]]
id = "close-calls-get-more-pairs"
requirement = "BEAR-005"
stages = ["ci"]
kind = "cargo"
filter = "close_calls_get_more_pairs_and_closed_games_none"

[[eval]]
id = "doesnt-matter-texts-are-distinct"
requirement = "BEAR-005"
stages = ["ci"]
kind = "cargo"
filter = "every_game_is_explained_from_what_was_measured"

[[eval]]
id = "live-guide-has-tiers"
requirement = "BEAR-005"
stages = ["cd"]
kind = "http"
path = "/rooting.json"
body_contains = "\"tier\""

# BEAR-006: Tiebreaker claims are exact

[[eval]]
id = "real-tiebreaks-traced"
requirement = "BEAR-006"
stages = ["ci"]
kind = "cargo"
filter = "traces_real_tiebreaks"

[[eval]]
id = "golden-week-2018-head-to-head"
requirement = "BEAR-006"
stages = ["ci"]
kind = "cargo"
filter = "golden_week_2018_week_17"
description = "The 2018 Bears' bye came down to head-to-head with the Rams, and the text says so."

# BEAR-007: Win chances use the best available odds

[[eval]]
id = "betting-lines-become-win-probabilities"
requirement = "BEAR-007"
stages = ["ci"]
kind = "cargo"
filter = "betting_lines_become_win_probabilities"

# BEAR-008: The page says how fresh it is

[[eval]]
id = "live-guide-says-when"
requirement = "BEAR-008"
stages = ["cd"]
kind = "http"
path = "/rooting.json"
body_contains = "\"generated_at\""

# BEAR-010: Fans can say when a verdict looks wrong

[[eval]]
id = "every-game-has-a-vote"
requirement = "BEAR-010"
stages = ["ci"]
kind = "playwright"
grep = "Verdict votes"
description = "Every game asks whether its verdict looks right, takes a note, and Do Not Track turns it off."

[[eval]]
id = "live-telemetry-takes-votes"
requirement = "BEAR-010"
stages = ["cd"]
kind = "http"
url = "https://jimhillr-telemetry.jim-hill-r.workers.dev/event"
method = "OPTIONS"
status = 204
description = "The telemetry Worker that votes go to is up and answers the browser's CORS check."

[[eval]]
id = "fans-are-voting"
requirement = "BEAR-010"
stages = ["observe"]
kind = "metric"
source = "analytics-engine"
metric = "bear_down_feedback_events"
min = 1
window = "14d"
description = "At least one real vote arrived in the past two weeks (in season)."

# BEAR-011: A fan can pick any team

[[eval]]
id = "any-team-gets-its-own-guide"
requirement = "BEAR-011"
stages = ["ci"]
kind = "cargo"
filter = "any_team_gets_its_own_guide"
description = "The Steelers' guide before 2025 week 18 explains every game for the Steelers, never the Bears."

[[eval]]
id = "team-picker"
requirement = "BEAR-011"
stages = ["ci"]
kind = "playwright"
grep = "Any team"
description = "Picking a team shows its guide, puts it in the link, remembers it, and keeps votes and the archive to the Bears."

[[eval]]
id = "live-guide-for-another-team"
requirement = "BEAR-011"
stages = ["cd"]
kind = "http"
path = "/teams/KC.json"
body_contains = "\"team\": \"KC\""
