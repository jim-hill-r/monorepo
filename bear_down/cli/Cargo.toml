[package]
name = "bear_down_cli"
description = "Downloads nflverse data, runs the bear_down simulation and writes rooting.json"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bear_down"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bear_down_core.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde.workspace = true
serde_json = "1.0.154"
