# bear_down/web: dioxus-web project. Standard tasks: ci, fix, build, test, dev, release, deploy.
# Run with: mise run <task>

[tools]
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
cargo-binstall = "latest"
"cargo:dioxus-cli" = "0.7.10"  # must match dioxus in ../Cargo.lock
node = "24"  # Playwright tests (package.json)

[task_config]
includes = ["../../standards/tasks/dioxus-web.toml"]

[env]
DX_PACKAGE = "bear_down_web"  # app inside a Cargo workspace; see standards/tasks/dioxus-web.toml
