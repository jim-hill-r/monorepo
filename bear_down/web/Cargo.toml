[package]
name = "bear_down_web"
description = "The bear_down web page, which renders rooting.json"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
bear_down_core = { workspace = true }
dioxus = { workspace = true, features = ["web"] }
serde = { workspace = true }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Response", "RequestInit", "RequestCache"] }
