# auth_sdk: threat model. Format and rules: standards/docs/security.md
reviewed = "2026-11-28"
summary = "Rust library for OAuth2 and OpenID Connect sign-in, used by cahokia and cookbook in the browser, with a native (desktop and mobile) client in progress. Holds no secrets; apps pass in their public client id."

[[surface]]
name = "library"
kind = "library"
access = "none"
data = "public"
notes = "Not published. Its users' surfaces and [auth] live in their own threat models."

[[threat]]
id = "AUTH-T1"
stride = "spoofing"
what = "An intercepted authorization code or forged callback signs someone in as another user."
mitigation = "PKCE, a random state checked on return (CSRF), and the ID token's nonce, issuer and audience validated through openidconnect. A token response without an ID token is rejected, so the nonce check can't be skipped. All of it lives once in src/flow.rs, shared by web and native, and is tested natively."

[[threat]]
id = "AUTH-T2"
stride = "information-disclosure"
what = "A vulnerable crypto dependency leaks keys (RUSTSEC-2023-0071 in rsa, through openidconnect)."
mitigation = "We only verify Auth0 tokens with a public key, which that attack doesn't touch; the advisory is tracked in auth_sdk/docs/issues/threat-check-advisories-openidconnect.md."

[[threat]]
id = "AUTH-T3"
stride = "spoofing"
what = "On desktop or mobile, another local app takes the loopback port or registers the same URL scheme and receives the callback meant for ours."
mitigation = "PKCE: the code is useless without the verifier, which never leaves our process. The callback must match the configured redirect URI and carry our state, and the loopback listener (src/native/loopback.rs) binds 127.0.0.1 only, accepts one GET /callback, and closes the port once it arrives or after a timeout. See docs/plans/2026-11-native-sign-in.md."
