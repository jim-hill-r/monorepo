[package]
name = "auth_sdk"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tracing = "0.1.44"
thiserror = "2.0.17"
oauth2 = { version = "5.0.0", features = ["reqwest"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }
reqwest = { version = "0.13.1" }
serde = "1.0.228"
serde_json = "1.0.148"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.77", features = [
    "Location",
    "Storage",
    "UrlSearchParams",
    "Window",
] }
