[package]
name = "auth_sdk"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tracing = "0.1.41"
thiserror = "2.0.12"
oauth2 = { version = "5.0.0", features = ["reqwest"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }
reqwest = { version = "0.12.20" }
serde = "1.0.219"
serde_json = "1.0.140"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.77", features = [
    "Location",
    "Storage",
    "UrlSearchParams",
    "Window",
] }
