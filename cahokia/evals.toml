# How each requirement in docs/requirements.md is checked.
# Format: standards/docs/evals.md.

prefix = "CAHO"

# CAHO-001: A family tree is drawn so anyone can read it

[[eval]]
id = "generations-in-rows"
requirement = "CAHO-001"
stages = ["ci"]
kind = "cargo"
filter = "parents_sit_above_children_across_three_generations"

[[eval]]
id = "spouses-side-by-side"
requirement = "CAHO-001"
stages = ["ci"]
kind = "cargo"
filter = "spouses_sit_next_to_each_other"

[[eval]]
id = "boxes-with-names-and-years"
requirement = "CAHO-001"
stages = ["ci"]
kind = "cargo"
filter = "draws_a_box_per_person_with_name_and_years"

[[eval]]
id = "lines-per-relationship"
requirement = "CAHO-001"
stages = ["ci"]
kind = "cargo"
filter = "draws_a_line_per_relationship"

[[eval]]
id = "long-names-shortened"
requirement = "CAHO-001"
stages = ["ci"]
kind = "cargo"
filter = "long_names_are_shortened_with_full_name_as_tooltip"

[[eval]]
id = "sample-family-shown"
requirement = "CAHO-001"
stages = ["ci"]
kind = "cargo"
filter = "draws_every_sample_person"

[[eval]]
id = "family-tree-page"
requirement = "CAHO-001"
stages = ["ci"]
kind = "playwright"
description = "Heading, a box per sample person, the lines, and a wide tree kept inside the page."

[[eval]]
id = "family-tree-page-live"
requirement = "CAHO-001"
stages = ["cd"]
kind = "http"
path = "/family-tree"
asset_contains = "Thomas Reed"
description = "The app shell loads, and the bundle it ships has the sample family."

# CAHO-002: Odd or broken family data never breaks the tree

[[eval]]
id = "parent-cycle"
requirement = "CAHO-002"
stages = ["ci"]
kind = "cargo"
filter = "parent_cycle_does_not_panic"

[[eval]]
id = "own-parent"
requirement = "CAHO-002"
stages = ["ci"]
kind = "cargo"
filter = "own_parent_does_not_panic"

[[eval]]
id = "missing-people"
requirement = "CAHO-002"
stages = ["ci"]
kind = "cargo"
filter = "relationships_to_missing_people_are_ignored"

[[eval]]
id = "disconnected-people"
requirement = "CAHO-002"
stages = ["ci"]
kind = "cargo"
filter = "disconnected_people_are_placed"

[[eval]]
id = "insertion-order"
requirement = "CAHO-002"
stages = ["ci"]
kind = "cargo"
filter = "layout_does_not_depend_on_insertion_order"

# CAHO-003: Anyone can sign in from any page

[[eval]]
id = "issuer-trailing-slash"
requirement = "CAHO-003"
stages = ["ci"]
kind = "cargo"
filter = "test_auth0_domain_has_trailing_slash"

[[eval]]
id = "redirect-url-is-a-callback"
requirement = "CAHO-003"
stages = ["ci"]
kind = "cargo"
filter = "test_redirect_url_matches_auth0_callback_urls"

[[eval]]
id = "sign-in-config"
requirement = "CAHO-003"
stages = ["ci"]
kind = "playwright"
description = "Sign in with jimhillr shows on the home page, never a sign-in error, and the redirect is the site root from every page."

[[eval]]
id = "home-page-live"
requirement = "CAHO-003"
stages = ["cd"]
kind = "http"
path = "/"
asset_contains = "dev-jdadpn4pckxevrv5.us.auth0.com/authorize"
description = "The app shell loads, and the bundle it ships signs in with cahokia's Auth0 tenant."

[[eval]]
id = "auth0-callbacks"
requirement = "CAHO-003"
stages = ["human"]
kind = "human-check"
setting = "auth0-cahokia-app"

# CAHO-004: The site loads only what it needs

[[eval]]
id = "csp"
requirement = "CAHO-004"
stages = ["ci"]
kind = "cargo"
filter = "test_csp_"
description = "The CSP blocks default sources and allows only Auth0, wasm and fonts."

# CAHO-005: It is easy to move around the site

[[eval]]
id = "sidebar"
requirement = "CAHO-005"
stages = ["ci"]
kind = "playwright"

[[eval]]
id = "sidebar-links-family-tree"
requirement = "CAHO-005"
stages = ["ci"]
kind = "playwright"
grep = "is linked from the sidebar"

# CAHO-006 has no evals yet: it came with the family tree epic's phase 5.

# CAHO-007: A person can explore the tree around one relative

[[eval]]
id = "zoom-keeps-anchor"
requirement = "CAHO-007"
stages = ["ci"]
kind = "cargo"
filter = "zoom_keeps_the_anchor_over_the_same_layout_point"

[[eval]]
id = "lineage-lines-highlighted"
requirement = "CAHO-007"
stages = ["ci"]
kind = "cargo"
filter = "only_lines_along_the_lineage_are_highlighted"

[[eval]]
id = "focus-person-highlighted"
requirement = "CAHO-007"
stages = ["ci"]
kind = "cargo"
filter = "focus_person_highlights_ancestors_and_descendants_and_dims_the_rest"

[[eval]]
id = "pan-zoom-focus-in-browser"
requirement = "CAHO-007"
stages = ["ci"]
kind = "playwright"
description = "Drag to pan, zoom with buttons, wheel, pinch and Fit, and pick a focus person by click or from the list."
