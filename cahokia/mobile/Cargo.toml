[package]
name = "mobile"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
design_system_dioxus = { workspace = true }
auth_sdk = { workspace = true }
tracing = { workspace = true }
# Opens Auth0 in Safari for sign-in. dioxus-desktop already depends on it.
webbrowser = { version = "1.2.7", features = ["hardened"] }

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]

[dev-dependencies]
dioxus-ssr = "0.7.3"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
