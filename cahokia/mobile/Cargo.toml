[package]
name = "mobile"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
design_system_dioxus = { workspace = true }
auth_sdk = { workspace = true }
tracing = { workspace = true }
# Waits for the sign-in callback (`auth::CallbackInbox`); dioxus mobile
# already runs on tokio.
tokio = { version = "1.48.0", features = ["sync", "time"] }
# Opens the authorize URL in the system browser on iOS and Android.
# `hardened` refuses to open anything but http and https URLs.
webbrowser = { version = "1.2.7", features = ["hardened"] }

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]

[dev-dependencies]
dioxus-ssr = "0.7.3"
# The sign-in tests run a fake OpenID provider on 127.0.0.1.
serde_json = "1.0.149"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt"] }
url = "2.5.9"
